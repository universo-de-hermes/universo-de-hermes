<!DOCTYPE html>
<html>
<head><title>Universo de JuanJo</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#0a0a1a; color:white; font-family:Arial, sans-serif; text-align:center; padding:40px 20px; }
h1 { font-size:28px; color:#B0E0E6; }
p { color:#a9a9a9; font-size:16px; }
.cards { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:30px; max-width:900px; margin-left:auto; margin-right:auto; }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; width:260px; text-decoration:none; color:white; display:inline-block; transition:0.3s; }
.card:hover { background:rgba(255,255,255,0.1); transform:translateY(-3px); }
.card h2 { font-size:20px; margin:0 0 8px; }
.card p { font-size:13px; color:#a9a9a9; margin:0; }
.badge { background:#B0E0E6; color:#0a0a1a; padding:4px 12px; border-radius:20px; font-size:12px; display:inline-block; margin-top:12px; }
.footer { font-size:12px; color:#555; margin-top:40px; }
</style>
</head>
<body>
  <h1>🎩 Universo de JuanJo</h1>
  <p>Ecosistema multi-agente corriendo 24/7 🚀</p>
  <div class="cards">
    <a href="https://edificio.universojota.tech/Command%20Center%20Oficina.html" class="card">
      <h2>🏢 Command Center 3D</h2>
      <p>Edificio con agentes en tiempo real</p>
      <span class="badge">Abrir</span>
    </a>
    <a href="https://houdiniweb.universojota.tech" class="card">
      <h2>🌐 Orbe Houdini</h2>
      <p>Web UI con control por voz</p>
      <span class="badge">Abrir</span>
    </a>
    <a href="https://crmcjm.universojota.tech" class="card">
      <h2>📊 CRM CJ Medical</h2>
      <p>Panel de recepcionista</p>
      <span class="badge">Abrir</span>
    </a>
  </div>
  <p class="footer">🎩 Houdini · 🤖 Pepe · 🔒 SSL</p>
</body>
</html>
