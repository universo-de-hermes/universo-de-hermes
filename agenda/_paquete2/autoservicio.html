/* ═══════════════════════════════════════════════════════════════════
   Vidrio líquido — los mismos gestos que la agenda, con la paleta de
   esta pantalla. Todo sale de estas fichas: cambiar la marca es
   cambiar las fichas de --acento y --marca de aquí abajo.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* La marca de CJ Medical, la misma de la agenda: el terracota sale del
     logo. Las dos pantallas tienen que parecer la misma casa. */
  --acento:#AD6450; --acento-2:#8E4E3D; --acento-ink:#FFF7F4;
  --marca-2:#C88878; --marca-3:#E8A898;

  /* vidrio lechoso */
  --bg:#EAE2DC; --bg-2:#F6F1EE;
  --ink:#2A2320; --ink-2:#544942; --ink-3:#6E6059;
  --line:rgba(42,35,32,.13); --line-2:rgba(42,35,32,.07);
  --glass:rgba(255,253,252,.60);      /* panel */
  --glass-2:rgba(255,253,252,.44);    /* panel tenue */
  --glass-3:rgba(255,255,255,.86);    /* el activo: vidrio más brillante */
  --glass-hi:rgba(255,255,255,.95);   /* brillo del borde de arriba */
  --shadow:0 26px 60px -24px rgba(70,46,38,.32), 0 6px 18px -8px rgba(70,46,38,.14);
  --shadow-sm:0 10px 26px -14px rgba(70,46,38,.30);
  --shadow-lg:0 40px 90px -30px rgba(70,46,38,.38), 0 10px 26px -10px rgba(70,46,38,.18);

  /* manchas de luz del fondo, en los colores de la marca */
  --blob-a:rgba(200,136,120,.52); --blob-b:rgba(240,176,152,.44);
  --blob-c:rgba(126,108,101,.22);
  --blob-op:.88;

  --bien:#2E7D5B; --mal:#A8422F;
  --r-lg:28px; --r-md:22px; --r-sm:16px;
  --blur:30px; --sat:170%;
  --blur-min:18px; --sat-min:160%;    /* para lo que se repite mucho */
}
/* vidrio ahumado */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --acento:#E7A78F; --acento-2:#F0B098; --acento-ink:#241A16;
  --marca-2:#C88878; --marca-3:#F0B098;
  --bg:#181210; --bg-2:#241B17;
  --ink:#F6F0EC; --ink-2:#CBBEB7; --ink-3:#A0928B;
  --line:rgba(255,255,255,.17); --line-2:rgba(255,255,255,.09);
  --glass:rgba(60,48,43,.60); --glass-2:rgba(60,48,43,.42);
  --glass-3:rgba(92,75,66,.80); --glass-hi:rgba(255,255,255,.26);
  --shadow:0 30px 70px -26px rgba(0,0,0,.76), 0 6px 20px -8px rgba(0,0,0,.50);
  --shadow-sm:0 12px 28px -16px rgba(0,0,0,.70);
  --shadow-lg:0 44px 100px -32px rgba(0,0,0,.82), 0 12px 30px -12px rgba(0,0,0,.55);
  --blob-a:rgba(200,136,120,.66); --blob-b:rgba(240,176,152,.42);
  --blob-c:rgba(152,118,104,.34);
  --blob-op:1;
  --bien:#6FC79C; --mal:#E8A08A;
}}
:root[data-theme="dark"]{
  --acento:#E7A78F; --acento-2:#F0B098; --acento-ink:#241A16;
  --marca-2:#C88878; --marca-3:#F0B098;

  --ink:#F6F0EC; --ink-2:#CBBEB7; --ink-3:#A0928B;
  --line:rgba(255,255,255,.17); --line-2:rgba(255,255,255,.09);
  --glass:rgba(60,48,43,.60); --glass-2:rgba(60,48,43,.42);
  --glass-3:rgba(92,75,66,.80); --glass-hi:rgba(255,255,255,.26);
  --shadow:0 30px 70px -26px rgba(0,0,0,.76), 0 6px 20px -8px rgba(0,0,0,.50);
  --shadow-sm:0 12px 28px -16px rgba(0,0,0,.70);
  --shadow-lg:0 44px 100px -32px rgba(0,0,0,.82), 0 12px 30px -12px rgba(0,0,0,.55);
  --blob-a:rgba(200,136,120,.66); --blob-b:rgba(240,176,152,.42);
  --blob-c:rgba(152,118,104,.34);
  --blob-op:1;
  --bien:#6FC79C; --mal:#E8A08A;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* #bienvenida, #llave y #app traen display propio, que le gana al
   display:none del navegador para [hidden]. */
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:"Neue Montreal",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-weight:300;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
input,select,button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ── las manchas de luz: lo que hace que el vidrio se note ────────── */
#blobs{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  filter:blur(86px);opacity:var(--blob-op,.9)}
#blobs i{position:absolute;display:block;border-radius:50%}
/* tres manchas separadas: si se tocan, queda un degradado y el vidrio deja
   de notarse. Tienen que leerse como luces sueltas detrás del panel. */
/* Medidas en vmax, no en vw: en una tablet parada, unas manchas medidas a lo
   ancho quedan chiquitas arriba y abajo y el centro de la pantalla se ve
   plano — justo donde va el vidrio. Con vmax cubren igual parada y acostada. */
#blobs i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-16vmax;background:var(--blob-b)}
#blobs i:nth-child(2){width:48vmax;height:48vmax;right:-13vmax;bottom:-17vmax;background:var(--blob-a)}
#blobs i:nth-child(3){width:34vmax;height:34vmax;left:52%;top:8%;background:var(--blob-c)}

/* ── la receta del vidrio, una sola vez ───────────────────────────── */
.vidrio{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow);
}
.vidrio-sm{
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm);
}
/* si el navegador no sabe desenfocar, se rellena y no se ve roto */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .vidrio,.vidrio-sm{background:var(--bg-2)}
}
/* a quien le molesta la transparencia, se le quita */
@media (prefers-reduced-transparency:reduce){
  .vidrio,.vidrio-sm{background:var(--bg-2);
    -webkit-backdrop-filter:none;backdrop-filter:none}
  #blobs{opacity:.35}
}

/* ── armazón ──────────────────────────────────────────────────────── */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;margin:14px 18px 0;
  flex:0 0 auto;border-radius:999px;
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm)}
header img{height:34px;width:auto}
header .sede{font-size:14px;color:var(--ink-2);letter-spacing:.02em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .spacer{flex:1}
/* 44px de alto es el mínimo para que un dedo le pegue sin pensarlo. Estaban
   en 37 y había que apuntar. */
/* 44px es lo mínimo para que un dedo le pegue sin apuntar. */
header button{font-size:14px;color:var(--ink-2);padding:9px 18px;border-radius:999px;
  min-height:44px;
  min-height:44px;white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--line);background:var(--glass-2);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
header button:active{background:var(--glass-3);color:var(--ink)}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:18px 30px 30px;display:flex;flex-direction:column;align-items:center}
.hoja{width:100%;max-width:880px;display:flex;flex-direction:column;gap:22px;
  animation:entra .3s cubic-bezier(.2,.8,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
h1{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
h2{font-size:22px;font-weight:500;letter-spacing:-.01em}
.sub{font-size:17px;color:var(--ink-2);line-height:1.45;margin-top:8px}
.pie{font-size:14px;color:var(--ink-3)}
/* el logo cambia con el tema: el claro no se ve sobre el vidrio ahumado */
img.solo-oscuro{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) img.solo-claro{display:none}
  :root:not([data-theme="light"]) img.solo-oscuro{display:inline-block} }
:root[data-theme="dark"] img.solo-claro{display:none}
:root[data-theme="dark"] img.solo-oscuro{display:inline-block}

/* ── botones: todos píldora ───────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  white-space:nowrap;
  min-height:62px;padding:0 34px;border-radius:999px;font-size:19px;font-weight:500;
  color:var(--ink);
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm);
  transition:transform .13s ease, background .13s ease}
.btn:active{transform:scale(.975);background:var(--glass-3)}
/* el principal: vidrio teñido de marca, no un bloque plano */
.btn.pri{background:var(--acento);background:linear-gradient(180deg,
    color-mix(in srgb, var(--acento) 92%, white 8%),
    var(--acento));
  color:var(--acento-ink);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), var(--shadow)}
.btn.pri:active{background:var(--acento-2)}
.btn.grande{min-height:78px;font-size:22px;padding:0 44px}
.btn.plano{box-shadow:inset 0 1px 0 var(--glass-hi);background:var(--glass-2)}
.btn.peligro{color:var(--mal)}
.btn[disabled]{opacity:.5;pointer-events:none}.btn.pri[disabled]{opacity:1;background:var(--ink-2);color:var(--acento-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),var(--shadow-sm);border-color:transparent}
.fila{display:flex;gap:14px;flex-wrap:wrap}
.fila.fin{justify-content:flex-end}

/* ── tarjetas y rejillas ──────────────────────────────────────────── */
.tarjeta{border-radius:var(--r-lg);padding:26px 28px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow)}
.rejilla{display:grid;gap:12px}
.rejilla.c2{grid-template-columns:repeat(2,1fr)}
.rejilla.c3{grid-template-columns:repeat(3,1fr)}
.rejilla.c4{grid-template-columns:repeat(4,1fr)}
.rejilla.c5{grid-template-columns:repeat(5,1fr)}
/* las fichas se repiten mucho: desenfoque más corto, mismo gesto */
.opcion{border-radius:var(--r-md);padding:20px 18px;text-align:left;min-height:86px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;color:var(--ink);
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm);
  transition:transform .13s ease, background .13s ease}
.opcion:active{transform:scale(.975);background:var(--glass-3)}
/* el activo del grupo: píldora de vidrio más brillante */
.opcion[aria-pressed="true"]{background:var(--glass-3);
  box-shadow:inset 0 0 0 1.5px var(--acento),var(--shadow-sm);box-shadow:inset 0 1px 0 var(--glass-hi),
             inset 0 0 0 1.5px color-mix(in srgb, var(--acento) 55%, transparent),
             var(--shadow-sm)}
.opcion .t{font-size:18px;font-weight:500;line-height:1.25}
.opcion .d{font-size:14px;color:var(--ink-2)}
.hora{align-items:center;text-align:center;min-height:76px;padding:14px 8px;
  border-radius:999px}
.hora .t{font-size:21px;font-variant-numeric:tabular-nums}

/* ── formulario ───────────────────────────────────────────────────── */
label.campo{display:flex;flex-direction:column;gap:7px}
label.campo>span{font-size:14px;color:var(--ink-2);letter-spacing:.02em}
input[type=text],input[type=email],input[type=tel],input[type=password],select{
  height:62px;padding:0 20px;border-radius:999px;width:100%;font-size:19px;
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
input:focus,select:focus{outline:2px solid var(--acento);outline-offset:2px;
  background:var(--glass-3)}
input[readonly]{color:var(--ink-2)}
select{appearance:none;background-repeat:no-repeat;
  background-position:right 18px center;background-size:20px;padding-right:50px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234C5D64' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>")}
/* la flecha del desplegable también tiene que verse en el vidrio ahumado */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23BFB2AB' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>")}}
:root[data-theme="dark"] select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23BFB2AB' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>")}
.dato{display:flex;justify-content:space-between;gap:20px;padding:15px 0;
  border-bottom:1px solid var(--line-2);font-size:18px}
.dato:last-child{border-bottom:none}
.dato .k{color:var(--ink-2);font-size:16px}
.dato .v{font-weight:500;text-align:right}

/* ── teclado ──────────────────────────────────────────────────────── */
.visor{font-size:44px;font-weight:500;letter-spacing:.08em;text-align:center;
  min-height:72px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.visor .vacio{color:var(--ink-3);font-size:24px;letter-spacing:0;font-weight:300}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:430px;
  margin:0 auto;width:100%}
.teclas button{height:80px;border-radius:999px;font-size:28px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm);
  transition:transform .1s ease, background .1s ease}
.teclas button:active{background:var(--glass-3);transform:scale(.96)}
.teclas button.aux{font-size:17px;font-weight:300;color:var(--ink-2)}

/* ── avisos ───────────────────────────────────────────────────────── */
.aviso{border-radius:var(--r-md);padding:16px 20px;font-size:17px;line-height:1.45;
  color:var(--ink);
  background:var(--glass);background:color-mix(in srgb, var(--mal) 14%, var(--glass));
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid color-mix(in srgb, var(--mal) 30%, transparent);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
.aviso.ok{background:var(--glass);background:color-mix(in srgb, var(--bien) 14%, var(--glass));
  border-color:color-mix(in srgb, var(--bien) 28%, transparent)}
.aviso.nota{background:var(--glass-2);
  background:color-mix(in srgb, var(--marca-3) 16%, var(--glass));
  border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;
  background:var(--glass-3);color:var(--ink);font-size:15px;font-weight:500;
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi)}
.cargando{display:flex;align-items:center;gap:14px;color:var(--ink-2);font-size:17px;
  justify-content:center;padding:44px 0}
.giro{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);
  border-top-color:var(--acento);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* el campo que falta: borde y contorno, no solo el aviso de arriba */
.campo.malo > span{color:var(--mal)}
.campo.malo input,.campo.malo select,
input[data-malo],select[data-malo]{
  border-color:var(--mal);
  box-shadow:inset 0 0 0 1.5px var(--mal)}
input[data-malo]:focus,select[data-malo]:focus{
  outline:2px solid var(--mal);outline-offset:2px}
.pista-doc{text-align:center;font-size:16px;line-height:1.4;color:var(--acento);
  margin:-4px 0 14px;min-height:22px}
.vacio-msg{text-align:center;color:var(--ink-2);font-size:17px;padding:26px 10px;
  line-height:1.5}

/* ── hoja de aviso ────────────────────────────────────────────────── */
/* Reemplaza los cuadros grises del navegador (confirm/alert). Aparte de
   verse de la casa, esos cuadros congelan la página entera mientras están
   abiertos, y en una tablet de recepción eso es lo último que uno quiere. */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;
  justify-content:center;padding:24px;
  background:rgba(0,0,0,.45);background:color-mix(in srgb, var(--bg) 58%, transparent);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
#modal .caja{width:100%;max-width:460px;text-align:center;
padding:4.2vmin;padding:clamp(26px,4.2vmin,40px);border-radius:var(--r-lg);
  display:flex;flex-direction:column;gap:18px;
  animation:entra .24s cubic-bezier(.2,.8,.3,1)}
#modal h2{font-size:3.2vmin;font-size:clamp(20px,3.2vmin,27px)}
#modal p{font-size:2.3vmin;font-size:clamp(15px,2.3vmin,18px);color:var(--ink-2);line-height:1.5}
#modal .fila{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ── bienvenida ───────────────────────────────────────────────────── */
/* Todo se mide contra vmin (el lado corto de la pantalla). Una tablet
   vertical de 768 de ancho es una pantalla GRANDE, no un celular estirado:
   con anchos fijos le tocaba tipografía de celular y quedaba una islita de
   texto flotando en el centro. Con vmin, la letra crece con la pantalla y
   la composición se sostiene igual acostada que parada. */
#bienvenida{position:fixed;inset:0;z-index:20;text-align:center;
padding:5.4vmin;padding:clamp(26px,5.4vmin,72px);
  display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;
grid-row-gap:4.4vmin;row-gap:4.4vmin;row-gap:clamp(20px,4.4vmin,60px)}
/* El teléfono esconde parte de la ventana detrás de su propia barra. dvh
   mide lo que de verdad se ve; vh queda de respaldo para lo que no lo sepa. */
@supports (height:100dvh){ #bienvenida{height:100dvh} }
/* la marca, centrada en la mitad de arriba */
#bienvenida .marca{grid-row:2;display:flex;flex-direction:column;align-items:center;
gap:2vmin;gap:clamp(10px,2vmin,22px)}
#bienvenida img{height:15vmin;height:clamp(64px,15vmin,180px);width:auto}
#bienvenida h1{font-size:10vmin;font-size:clamp(34px,10vmin,104px);line-height:1.1}
#bienvenida .sub{font-size:3.6vmin;font-size:clamp(17px,3.6vmin,42px);margin-top:0}
/* La invitación vive abajo, donde llega la mano de quien está de pie
   frente a la tablet, no en la mitad de la pantalla. */
#bienvenida .abajo{grid-row:3;align-self:center;display:flex;flex-direction:column;
  align-items:center;gap:2.2vmin;gap:clamp(12px,2.2vmin,22px)}
#bienvenida .quehace{font-size:3.2vmin;font-size:clamp(16px,3.2vmin,36px);color:var(--ink-3);
  max-width:30ch;line-height:1.5;text-wrap:balance}
#bienvenida .toque{font-size:4.4vmin;font-size:clamp(19px,4.4vmin,46px);color:var(--acento-ink);
padding:3.4vmin 7.5vmin;padding:clamp(20px,3.4vmin,40px) clamp(38px,7.5vmin,96px);border-radius:999px;
  background:var(--acento);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow);
  animation:latir 2.8s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* ── abrir la tablet ──────────────────────────────────────────────── */
#llave{position:fixed;inset:0;z-index:30;display:flex;align-items:center;
  justify-content:center;padding:30px}
#llave .caja{width:min(440px,100%);border-radius:var(--r-lg);padding:34px 32px;
  display:flex;flex-direction:column;gap:16px;text-align:center;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-lg)}
#llave img{height:48px;width:auto;margin:0 auto 4px}
#llave h1{font-size:24px}
#llave .sub{font-size:14.5px;margin-top:0}
#llave .campo{text-align:left}
#llave .pie{margin-top:2px}

/* ── confirmación ─────────────────────────────────────────────────── */
.final{text-align:center}
.final .marca{width:80px;height:80px;border-radius:50%;margin:0 auto 22px;
  display:grid;place-items:center;
  background:var(--glass-3);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm)}
.final .marca svg{width:38px;height:38px;stroke:var(--acento);fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.final h1{font-size:32px}
.detalle{margin-top:26px;text-align:left}
.detalle .dato .v{font-size:19px}
.gracias{margin-top:24px;font-size:19px;color:var(--ink-2)}

/* ── calendario ───────────────────────────────────────────────────── */
.cal{max-width:440px;margin:0 auto;width:100%}
.cal .cab{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal .cab .m{flex:1;text-align:center;font-size:19px;font-weight:500;
  text-transform:capitalize}
.cal .cab button{width:54px;height:54px;border-radius:999px;display:grid;
  place-items:center;color:var(--ink);
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm)}
.cal .cab button:active{background:var(--glass-3)}
.cal .cab button svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal .sem,.cal .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .sem span{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--ink-3);
  padding-bottom:6px;text-transform:uppercase}
.cal .dias button{aspect-ratio:1/1;min-height:54px;border-radius:50%;font-size:18px;
  font-variant-numeric:tabular-nums;display:grid;place-items:center;color:var(--ink);
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  backdrop-filter:blur(var(--blur-min)) saturate(var(--sat-min));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  transition:transform .1s ease, background .1s ease}
.cal .dias button:active{background:var(--glass-3);transform:scale(.94)}
.cal .dias button[disabled]{opacity:.28;background:transparent;border-color:transparent;
  box-shadow:none}
.cal .dias button.on{background:var(--glass-3);font-weight:500;
  box-shadow:inset 0 0 0 1.5px var(--acento),var(--shadow-sm);box-shadow:inset 0 1px 0 var(--glass-hi),
             inset 0 0 0 1.5px color-mix(in srgb, var(--acento) 60%, transparent),
             var(--shadow-sm)}

/* En un monitor, el encabezado estirado de lado a lado hace que se vea
   como una tablet agrandada. Se alinea con la columna de contenido. */
@media (min-width:1100px){
  header{width:min(calc(100% - 40px), 1120px);margin-left:auto;margin-right:auto}
  .hoja{max-width:980px}
}
@media (max-width:820px){
  header{padding:12px 16px;margin:10px 12px 0} main{padding:14px 18px 22px}
  /* La bienvenida ya no entra aquí: se mide contra vmin y crece sola. */
  h1{font-size:30px}
  .rejilla.c4,.rejilla.c5{grid-template-columns:repeat(3,1fr)}
  .rejilla.c3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .rejilla.c2,.rejilla.c3,.rejilla.c4,.rejilla.c5{grid-template-columns:repeat(2,1fr)}
  /* El formulario sí baja a una columna: en dos, «Cédula de ciudadanía» y el
     correo salían cortados y no se alcanzaba a leer lo que uno escribía. */
  .rejilla.campos{grid-template-columns:1fr}
  /* Y los botones de abajo, uno encima del otro y de lado a lado: el
     principal queda donde cae el pulgar. */
  .fila.fin{flex-direction:column;align-items:stretch}
  .btn{min-height:56px;font-size:17px;padding:0 22px}
  :root{--blur:22px;--blur-min:14px}
  /* En un teléfono no cabe el nombre de la sede al lado de los botones, y
     ya está en la bienvenida. Antes empujaba «Empezar de nuevo» fuera de
     la pantalla. */
  header{gap:10px;padding:10px 12px;margin:8px 10px 0}
  header img{height:28px}
  header .sede{display:none}
  header button{font-size:13px;padding:8px 14px;min-height:44px}
  main{padding:12px 14px 20px}
  .hoja{gap:18px}
  h1{font-size:24px} .sub{font-size:15.5px}
  .opcion{min-height:76px;padding:16px 14px}
  .opcion .t{font-size:16.5px} .opcion .d{font-size:13px}
  .cal .dias button{min-height:40px}
  .cal .sem,.cal .dias{gap:5px}
  .cal .cab button{width:46px;height:46px}
  .tarjeta{padding:20px 18px}
  .teclas button{height:68px;font-size:25px}
  .visor{font-size:36px;min-height:60px}
  .dato{font-size:16px;flex-wrap:wrap;gap:4px}
  .dato .v{text-align:left}
}
/* Pantalla vertical (tótem, tablet de pie): el contenido se centra a lo
   alto en vez de quedar pegado arriba con un vacío enorme debajo.
   Se centra con `margin:auto`, NO con justify-content: cuando el contenido
   es más alto que la pantalla, justify-content:center le corta la parte de
   arriba y deja lo primero debajo del encabezado, sin forma de subir. */
@media (max-aspect-ratio:3/4){
  .hoja{margin-top:auto;margin-bottom:auto}
}
@media (max-aspect-ratio:3/4) and (min-width:700px){
  .hoja{max-width:740px}
}

/* ══════════════════════════════════════════════════════════════════════════
   CAPA DE COMPATIBILIDAD — tablets antiguas (iPad iOS 12 / Safari 12 y antes)

   Safari 12 no entiende:  gap en flexbox · clamp() · 100dvh
   Aquí se les da un equivalente, para que la tablet vieja se vea igual de bien
   que las nuevas. TODO va dentro de @supports not (aspect-ratio:1), que es
   falso en cualquier navegador moderno: en la tablet nueva y en el PC esta
   capa NO se activa y no cambia absolutamente nada.
   ══════════════════════════════════════════════════════════════════════════ */
@supports not (aspect-ratio:1){

  /* ── 1. gap en flexbox → márgenes (siempre al lado, nunca en los bordes) ── */
  header{gap:0}                header>*{margin-right:16px}        header>*:last-child{margin-right:0}
  .fila{gap:0}                 .fila>*{margin-right:14px;margin-bottom:14px}
                               .fila>*:last-child{margin-right:0}
  .dato{gap:0}                 .dato>*{margin-right:20px}         .dato>*:last-child{margin-right:0}
  .cargando{gap:0}             .cargando>*{margin-right:14px}     .cargando>*:last-child{margin-right:0}
  .cal .cab{gap:0}             .cal .cab>*{margin-right:10px}     .cal .cab>*:last-child{margin-right:0}
  /* faltaban estos dos: el icono y el texto de un botón quedaban pegados */
  .btn{gap:0}                  .btn>*{margin-right:10px}          .btn>*:last-child{margin-right:0}
  .chip{gap:0}                 .chip>*{margin-right:8px}          .chip>*:last-child{margin-right:0}
  #modal .fila{gap:0}          #modal .fila>*{margin-right:12px;margin-bottom:12px}
                               #modal .fila>*:last-child{margin-right:0}

  .hoja{gap:0}                 .hoja>*{margin-bottom:22px}        .hoja>*:last-child{margin-bottom:0}
  .opcion{gap:0}               .opcion>*{margin-bottom:5px}       .opcion>*:last-child{margin-bottom:0}
  label.campo{gap:0}           label.campo>*{margin-bottom:7px}   label.campo>*:last-child{margin-bottom:0}
  #modal .caja{gap:0}          #modal .caja>*{margin-bottom:18px} #modal .caja>*:last-child{margin-bottom:0}
  #llave .caja{gap:0}          #llave .caja>*{margin-bottom:16px} #llave .caja>*:last-child{margin-bottom:0}
  #bienvenida .marca{gap:0}    #bienvenida .marca>*{margin-bottom:2vmin}
                               #bienvenida .marca>*:last-child{margin-bottom:0}
  #bienvenida .abajo{gap:0}    #bienvenida .abajo>*{margin-bottom:2.2vmin}
                               #bienvenida .abajo>*:last-child{margin-bottom:0}

  /* ── 2. altura de la pantalla (100dvh no existe en iOS 12) ── */
  #bienvenida{height:100vh}

  /* ── 3. aspect-ratio: sin él, el día del calendario queda ovalado ── */
  .cal .dias button{width:54px}

  /* Los clamp() ya NO se repiten aquí. Cada regla lleva delante su respaldo
     en vmin —el patrón de declarar lo simple antes de lo moderno— y eso es
     mejor: esta capa se enciende en cualquier navegador sin aspect-ratio, y
     un Safari 13.1–14.9 SÍ entiende clamp(). Repitiéndolo aquí le quitábamos
     el clamp bueno a esas tablets y les dejábamos el valor plano. */

  /* ── 4. los avisos: sin color-mix() se quedan sin borde ── */
  .aviso{border:1px solid var(--line)}
  .aviso.ok{border-color:rgba(111,199,156,.55)}
}
</style>

/* ═══════════════════════════════════════════════════════════════════
   Repuestos para tablets muy viejas
   ───────────────────────────────────────────────────────────────────
   El iPad de iOS 12.5.8 SÍ trae fetch y URLSearchParams (llegaron en
   Safari 10.1), así que para él esto no hace nada. Va por lo que pueda
   aparecer: en una tablet sin ellos la pantalla se ve pero no puede
   hablar con la agenda —sale el logo y ahí se queda—, y eso en
   recepción parece que la tablet está dañada. Treinta líneas, y solo
   se encienden si de verdad faltan.
   ═══════════════════════════════════════════════════════════════════ */
if (!window.fetch){
  window.fetch = function(url, o){
    o = o || {};
    return new Promise(function(listo, falla){
      var x = new XMLHttpRequest();
      x.open(o.method || "GET", url, true);
      var cab = o.headers || {};
      for (var k in cab) if (Object.prototype.hasOwnProperty.call(cab, k))
        x.setRequestHeader(k, cab[k]);
      x.onload = function(){
        listo({ok: x.status >= 200 && x.status < 300, status: x.status,
               json: function(){ return Promise.resolve(JSON.parse(x.responseText || "{}")); },
               text: function(){ return Promise.resolve(x.responseText || ""); }});
      };
      x.onerror = x.ontimeout = function(){ falla(new Error("red")); };
      x.send(o.body === undefined ? null : o.body);
    });
  };
}
if (!window.URLSearchParams){
  window.URLSearchParams = function(busca){
    var m = {};
    String(busca || "").replace(/^\?/, "").split("&").forEach(function(par){
      if (!par) return;
      var i = par.indexOf("="), k = i < 0 ? par : par.slice(0, i);
      var v = i < 0 ? "" : par.slice(i + 1);
      try { m[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, " ")); }
      catch (e) { m[k] = v; }
    });
    this.get = function(k){ return Object.prototype.hasOwnProperty.call(m, k) ? m[k] : null; };
  };
}

function h(tag, props){
  var e = document.createElement(tag), k;
  if (props) for (k in props){
    var v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (var i=2;i<arguments.length;i++){
    var kids = arguments[i];
    if (!Array.isArray(kids)) kids = [kids];
    kids.forEach(function(c){
      if (c === null || c === undefined || c === false) return;
      e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}

/* ─────────────────────────── llamadas al CRM ─────────────────────── */
/* La llave de esta tablet: la deja la recepcionista al abrirla y se queda
   guardada en este navegador. La clienta nunca la ve ni la escribe. */
var LLAVE = "";
try { LLAVE = localStorage.getItem("cj-tableta") || ""; } catch(e){}
function guardarLlave(t){
  LLAVE = t || "";
  try { if (LLAVE) localStorage.setItem("cj-tableta", LLAVE);
        else localStorage.removeItem("cj-tableta"); } catch(e){}
}

function url(ruta){ return ruta + (CLAVE ? (ruta.indexOf("?")>=0?"&":"?") + "k=" + encodeURIComponent(CLAVE) : ""); }
function pedir(ruta, cuerpo){
  var ini = {method: cuerpo ? "POST" : "GET", cache:"no-store",
             headers:{"accept":"application/json"}};
  if (LLAVE) ini.headers["x-tableta"] = LLAVE;
  if (cuerpo){
    ini.headers["content-type"] = "application/json";
    cuerpo.sede = SEDE; if (CLAVE) cuerpo.k = CLAVE;
    ini.body = JSON.stringify(cuerpo);
  }
  return fetch(url(ruta), ini).then(function(r){
    return r.json().catch(function(){ return {ok:false, mensaje:"La página no pudo leer la respuesta."}; })
      .then(function(j){
        if (!r.ok || j.ok === false){
          var e = new Error(j.mensaje || "No pudimos completar la operación.");
          e.codigo = j.error || ("HTTP" + r.status);
          /* si la tablet se cerró o se venció, se vuelve a pedir la llave en
             vez de dejar a la clienta con un error que no puede resolver */
          if (e.codigo === "SIN_TABLETA") pedirLlave("La tablet se cerró. "
            + "Pídale a recepción que la abra otra vez.");
          throw e;
        }
        return j;
      });
  }, function(){
    var e = new Error("Se perdió la conexión. Intente otra vez o pase a recepción.");
    e.codigo = "SIN_RED"; throw e;
  });
}
function soltarCupo(){
  if (!S || !S.reserva) return;
  var r = S.reserva; S.reserva = null;
  var cuerpo = JSON.stringify({reserva:r, k:CLAVE});
  var destino = url("/api/v2/autoservicio/soltar");
  /* keepalive no existe antes de Safari 13: en el iPad de iOS 12 ese fetch se
     cancelaba al salirse de la pantalla y el cupo se quedaba apartado hasta
     que vencía solo. sendBeacon sí existe desde Safari 11.1 y sobrevive. */
  try {
    if (navigator.sendBeacon &&
        navigator.sendBeacon(destino, new Blob([cuerpo], {type:"application/json"})))
      return;
  } catch(e){}
  try { fetch(destino, {method:"POST",
    headers:{"content-type":"application/json"}, body: cuerpo}); } catch(e){}
}

/* ───────────────────────── la hoja de aviso ──────────────────────── */
/* No bloquea nada: la respuesta llega por el botón que toquen. */
function aviso(o){
  var caja = h("div",{class:"caja vidrio"},
    h("h2",{}, o.titulo),
    o.texto ? h("p",{}, o.texto) : null);
  var fila = h("div",{class:"fila"});
  (o.botones || []).forEach(function(b){
    fila.appendChild(h("button",{class:"btn" + (b.clase ? " " + b.clase : ""),
      onclick:function(){ cerrarAviso(); if (b.hacer) b.hacer(); }}, b.texto));
  });
  caja.appendChild(fila);
  var m = $("#modal");
  m.innerHTML = ""; m.appendChild(caja); m.hidden = false;
}
function cerrarAviso(){ var m = $("#modal"); m.hidden = true; m.innerHTML = ""; }

/* ───────────────────── inactividad y vuelta a empezar ────────────── */
var relojInactivo = null, relojFinal = null, relojAviso = null;
var avisandoInactividad = false;
function tocar(){
  clearTimeout(relojInactivo); clearTimeout(relojAviso);
  if (avisandoInactividad){ avisandoInactividad = false; cerrarAviso(); }
  if (!$("#bienvenida").hidden) return;
  relojInactivo = setTimeout(preguntarSiSigue, ESPERA_INACTIVO);
}
/* Antes se borraba el formulario de una, sin avisar. Si la clienta está
   buscando la cédula en el bolso, vuelve y encuentra la pantalla en blanco
   y le toca escribirlo todo otra vez. Ahora se le avisa primero. */
function preguntarSiSigue(){
  if (!$("#bienvenida").hidden) return;     /* en la bienvenida no hay nada que perder */
  avisandoInactividad = true;
  aviso({titulo:"Seguimos aquí",
         texto:"Si no toca la pantalla, volvemos al inicio y se borra lo que escribió.",
         botones:[{texto:"Sí, continúo", clase:"pri grande"}]});
  relojAviso = setTimeout(function(){
    avisandoInactividad = false; cerrarAviso(); volverAlInicio();
  }, ESPERA_AVISO);
}
function volverAlInicio(){
  clearTimeout(relojFinal); clearTimeout(relojInactivo); clearTimeout(relojAviso);
  avisandoInactividad = false; cerrarAviso();
  limpiar();
  $("#app").hidden = true;
  $("#bienvenida").hidden = false;
}
["pointerdown","keydown","touchstart"].forEach(function(ev){
  document.addEventListener(ev, tocar, {passive:true});
});

var salioElAviso = false;
$("#bienvenida").addEventListener("click", function(){
  if (salioElAviso){ salioElAviso = false; return; }
  $("#bienvenida").hidden = true;
  $("#app").hidden = false;
  limpiar(); pintar(); tocar();
});
$("#h-salir").addEventListener("click", volverAlInicio);
$("#h-atras").addEventListener("click", function(){ atras(); });

/* ═══════════════════════════════════════════════════════════════════
   Arranque
   ═══════════════════════════════════════════════════════════════════ */
limpiar();
function noArranca(texto, detalle){
  /* Lo técnico va a la consola, para quien revisa la tablet. La clienta solo
     ve que pase a recepción: no tiene por qué leer cómo se configura esto. */
  if (detalle && window.console && console.warn) console.warn("[panel] " + detalle);
  $("#b-sede").textContent = texto;
  /* Si no arranca, se quita la invitación: decirle «toque para empezar» a
     una clienta cuando nada va a pasar es peor que no decirle nada. */
  $("#b-abajo").hidden = true;
  $("#bienvenida").style.pointerEvents = "none";   /* no deja entrar a medias */
  /* Si la agenda se cayó, la tablet se queda muerta hasta que alguien la
     recargue, y nadie lo va a notar. Se reintenta sola cada medio minuto:
     cuando la agenda vuelve, la tablet vuelve con ella. */
  clearTimeout(relojReintento);
  relojReintento = setTimeout(function(){ arrancar(); }, 30000);
}
var relojReintento = null;
function pedirLlave(nota){
  $("#bienvenida").hidden = true;
  $("#app").hidden = true;
  $("#llave").hidden = false;
  $("#l-sede").textContent = SEDE ? ("Sede: " + SEDE) : "";
  if (nota){ $("#l-error").textContent = nota; $("#l-error").hidden = false; }
  setTimeout(function(){ $("#l-correo").focus(); }, 80);
}
function arrancar(){
  return fetch(url("/api/v2/autoservicio/datos?sede=" + encodeURIComponent(SEDE)),
               {cache:"no-store", headers: LLAVE ? {"x-tableta":LLAVE} : {}})
    .then(function(r){ return r.json().then(function(j){ return {r:r, j:j}; }); })
    .then(function(x){
      if (x.j && x.j.error === "SIN_TABLETA"){ guardarLlave(""); pedirLlave(""); return; }
      if (!x.r.ok || !x.j || x.j.ok === false)
        throw new Error((x.j && x.j.mensaje) || "");
      D = x.j;
      $("#llave").hidden = true;
      $("#bienvenida").hidden = false;
      $("#b-sede").textContent = D.sede.nombre + (D.sede.ciudad ? " · " + D.sede.ciudad : "");
      $("#b-abajo").hidden = false;
      $("#bienvenida").style.pointerEvents = "";
      $("#h-sede").textContent = D.sede.nombre;
    })
    .catch(function(e){
      $("#llave").hidden = true;
      $("#bienvenida").hidden = false;
      noArranca(e.message || "No pudimos conectar con la agenda. "
                             + "Por favor pase a recepción.");
    });
}

$("#l-abrir").addEventListener("click", function(){
  var b = $("#l-abrir"), err = $("#l-error");
  var correo = $("#l-correo").value.trim(), clave = $("#l-clave").value;
  if (!correo || !clave){
    err.textContent = "Escriba el correo y la contraseña."; err.hidden = false; return;
  }
  b.disabled = true; b.textContent = "Abriendo…"; err.hidden = true;
  fetch(url("/api/v2/autoservicio/abrir"), {method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({correo:correo, clave:clave, sede:SEDE, k:CLAVE || undefined})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || j.ok === false) throw new Error(j && j.mensaje ? j.mensaje : "No se pudo abrir.");
      guardarLlave(j.token);
      $("#l-clave").value = ""; $("#l-correo").value = "";
      return arrancar();
    })
    .catch(function(e){ err.textContent = e.message; err.hidden = false; })
    .then(function(){ b.disabled = false; b.textContent = "Abrir"; });
});
$("#l-clave").addEventListener("keydown", function(e){
  if (e.key === "Enter") $("#l-abrir").click();
});

/* Cerrar la tablet: dos segundos sobre el logo. No es un botón a la vista
   para que ninguna clienta la cierre sin querer. */
(function(){
  var reloj = null;
  function empieza(){ reloj = setTimeout(function(){
    /* Soltar el logo después de los dos segundos también dispara un click
       sobre la bienvenida. Sin esto, la tablet entraría a la agenda por
       debajo del aviso. */
    aviso({titulo:"Cerrar esta tablet",
           texto:"Para volver a usarla habrá que abrirla con usuario y contraseña.",
           botones:[{texto:"No, dejarla abierta"},
                    {texto:"Sí, cerrarla", clase:"peligro", hacer:function(){
      fetch(url("/api/v2/autoservicio/cerrar"), {method:"POST",
        headers:{"content-type":"application/json"},
        body: JSON.stringify({t:LLAVE, k:CLAVE || undefined})}).catch(function(){});
      guardarLlave(""); pedirLlave("");
    }}]});
    /* Solo hay click que tragarse si el logo se apretó DESDE la bienvenida.
       Desde el encabezado no lo hay, y dejar la bandera puesta se comía el
       siguiente toque bueno. Además se limpia sola, por si acaso. */
    salioElAviso = !$("#bienvenida").hidden;
    if (salioElAviso) setTimeout(function(){ salioElAviso = false; }, 600);
  }, 2000); }
  function para(){ clearTimeout(reloj); }
  /* Hay DOS logos en cada sitio, el del tema claro y el del oscuro, y uno
     está siempre oculto. Esto usaba querySelector, que devuelve el primero:
     el del tema claro. Mientras el tema iba con el del aparato, a veces
     coincidía. Desde que el tema quedó fijo en oscuro, el gesto quedaba
     pegado al logo invisible y recepción NO PODÍA CERRAR LA TABLET.
     Se le pone a los dos. */
  ["#bienvenida img", "header img"].forEach(function(sel){
    Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){
      el.addEventListener("pointerdown", empieza);
      ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
        el.addEventListener(ev, para); });
    });
  });
})();

if (!SEDE){
  $("#bienvenida").hidden = false;
  noArranca("Por favor pase a recepción.",
            "Falta la sede en la dirección: abra …/autoservicio.html?sede=el-tesoro "
            + "o ?sede=bogota.");
} else if (!LLAVE){
  pedirLlave("");
} else {
  arrancar();
}

/* ═══════════════════════════════════════════════════════════════════
   Navegación
   ═══════════════════════════════════════════════════════════════════ */
var ATRAS = {
  ficha:"documento", nuevo:"documento", cita:"documento", verificar:"cita",
  servicio:"documento", cuando:"servicio", calendario:"cuando", horas:"cuando",
  especialista:"horas", resumen:"especialista", confirmar_cancelar:"verificar",
  reprogramar_servicio:"verificar"
};
function atras(){
  var destino = ATRAS[S.paso];
  if (!destino) return;
  if (S.paso === "resumen" || S.paso === "especialista") soltarCupo();
  /* Al reprogramar, la lista de servicios se abrió DESDE «Vamos a mover su
     cita»; ahí es a donde tiene que volver. Va antes que la regla de abajo,
     que si no se la lleva hasta la cita. */
  if (S.paso === "servicio" && S.modo === "reprogramar") destino = "reprogramar_servicio";
  else if (destino === "servicio" && S.modo === "reprogramar") destino = "cita";
  else if (destino === "documento" && S.paso === "servicio" && S.citaPrevia) destino = "cita";
  ir(destino);
}
function ir(paso){
  S.paso = paso; S.error = "";
  pintar();
  $("main").scrollTop = 0;
}
function conCarga(promesa, alTerminar){
  S.cargando = true; pintar();
  return promesa.then(function(r){
    S.cargando = false; S.error = "";
    alTerminar(r);
  }, function(e){
    S.cargando = false;
    S.error = e.message;
    /* Un error no puede dejarla varada en una pantalla sin salida: se la
       devuelve al paso donde puede arreglarlo, con el mensaje a la vista. */
    if (e.codigo === "CUPO_TOMADO" || e.codigo === "CUPO_APARTADO"){
      S.reserva = null; S.hora = null; S.especialista = null;
      cargarHoras(S.fecha, true);
      return;
    }
    if (e.codigo === "TELEFONO_NO_COINCIDE"){ S.telefono = ""; S.paso = "verificar"; }
    if (e.codigo === "LIMITE_DIA"){ S.puedeCambiar = false; S.paso = "cita"; }
    pintar();
  });
}

/* ═══════════════════════════════════════════════════════════════════
   Pintado
   ═══════════════════════════════════════════════════════════════════ */
function pintar(){
  var v = $("#vista"); v.textContent = "";
  $("#h-atras").hidden = !ATRAS[S.paso] || S.cargando;
  v.className = "hoja" + (S.paso === "horas" || S.paso === "servicio" ? " ancha" : "");

  if (S.cargando){ v.appendChild(cargando()); return; }
  if (S.error) v.appendChild(h("div",{class:"aviso"}, S.error));

  ({documento:vDocumento, ficha:vFicha, nuevo:vNuevo, cita:vCita,
    verificar:vVerificar, confirmar_cancelar:vConfirmarCancelar,
    reprogramar_servicio:vReprogramarServicio,
    servicio:vServicio, cuando:vCuando, calendario:vCalendario, horas:vHoras,
    especialista:vEspecialista, resumen:vResumen, final:vFinal}[S.paso] || vDocumento)(v);
}
function cargando(){
  return h("div",{class:"cargando"}, h("div",{class:"giro"}), "Un momento, por favor…");
}
function titulo(t, sub){
  return h("div", null, h("h1", null, t), sub ? h("div",{class:"sub"}, sub) : null);
}

/* El tipo de documento se escoge más adelante (en el formulario), así que
   aquí solo se puede comprobar el largo. Se toma el rango que cubre cédula
   de ciudadanía, de extranjería, tarjeta de identidad y NIT; el pasaporte
   lleva letras y no se puede digitar en un teclado numérico — esa clienta
   pasa a recepción, y así se lo dice la pista. */
var DOC_MIN = 6, DOC_MAX = 11;
function problemaDoc(d){
  d = String(d || "");
  if (!d.length) return "";
  if (d.length < DOC_MIN)
    return "Siga digitando: faltan " + (DOC_MIN - d.length) +
           (DOC_MIN - d.length === 1 ? " dígito." : " dígitos.");
  if (d.length > DOC_MAX)
    return "Ese número tiene más dígitos de los que lleva un documento. " +
           "Revíselo o pase a recepción.";
  return "";
}

/* ───────────────────────── 1. documento ──────────────────────────── */
function vDocumento(v){
  v.appendChild(titulo("Digite su número de documento",
    "Con eso buscamos sus datos. Si es su primera vez, la registramos en un momento."));
  var visor = h("div",{class:"visor"});
  /* Antes bastaban 5 dígitos y una cédula tiene de 6 a 10: se pasaba con un
     número incompleto y el error llegaba del servidor, ya tarde. Ahora se
     comprueba aquí y, sobre todo, se le DICE por qué no la deja seguir. */
  var pista = h("div",{class:"pista-doc", hidden:true});
  function repintarVisor(){
    visor.textContent = "";
    if (S.doc) visor.appendChild(document.createTextNode(S.doc));
    else visor.appendChild(h("span",{class:"vacio"},"— — — — — — —"));
    var p = problemaDoc(S.doc);
    /* Con el visor vacío el botón va apagado, pero sin regañar: todavía no ha
       escrito nada que esté mal. */
    seguir.disabled = !S.doc.length || !!p;
    pista.textContent = p || "";
    pista.hidden = !p;
  }
  var teclas = h("div",{class:"teclas"});
  ["1","2","3","4","5","6","7","8","9"].forEach(function(n){
    teclas.appendChild(h("button",{onclick:function(){
      if (S.doc.length < 15){ S.doc += n; repintarVisor(); } }}, n));
  });
  teclas.appendChild(h("button",{class:"aux", onclick:function(){
    S.doc = ""; repintarVisor(); }}, "Borrar todo"));
  teclas.appendChild(h("button",{onclick:function(){
    if (S.doc.length < 15){ S.doc += "0"; repintarVisor(); } }}, "0"));
  teclas.appendChild(h("button",{class:"aux", onclick:function(){
    S.doc = S.doc.slice(0,-1); repintarVisor(); }}, "◀ Una menos"));

  var seguir = h("button",{class:"btn pri grande", onclick:buscar}, "Continuar");
  v.appendChild(h("div",{class:"tarjeta"}, visor, pista, teclas));
  v.appendChild(h("div",{class:"fila fin"}, seguir));
  repintarVisor();
}

function buscar(){
  conCarga(pedir("/api/v2/autoservicio/cliente", {documento:S.doc}), function(j){
    S.puedeCambiar = j.puede_cambiar !== false;
    S.mensajeLimite = j.mensaje_limite || "";
    if (!j.encontrado){
      S.cliente = null;
      S.nuevo = {documento:S.doc, tipo_doc:"CC", primer_nombre:"",
                 primer_apellido:"", telefono:"", correo:""};
      return ir("nuevo");
    }
    S.cliente = j.cliente;
    S.citaPrevia = j.cita || null;
    ir("ficha");
  });
}

/* ───────────────────── 2. la ficha que ya existe ─────────────────── */
function vFicha(v){
  var c = S.cliente;
  v.appendChild(titulo("Hola, " + (c.primer_nombre || c.nombre),
    "Revise que estos datos estén bien antes de seguir."));
  var caja = h("div",{class:"tarjeta"},
    dato("Nombre", c.nombre),
    dato("Documento", (c.tipo_doc || "CC") + " " + c.documento),
    dato("Celular", c.telefono || "—"),
    dato("Correo", c.correo || "—"));
  v.appendChild(caja);
  if (!c.tiene_telefono || !c.tiene_correo)
    v.appendChild(h("div",{class:"aviso nota"},
      "Nos falta " + (!c.tiene_telefono && !c.tiene_correo ? "su celular y su correo"
        : (!c.tiene_telefono ? "su celular" : "su correo")) +
      ". Toque «Actualizar mis datos» para completarlo."));
  v.appendChild(h("div",{class:"fila fin"},
    h("button",{class:"btn", onclick:function(){
      S.nuevo = {cliente_id:c.id, documento:c.documento, tipo_doc:c.tipo_doc || "CC",
                 primer_nombre:c.primer_nombre, primer_apellido:c.primer_apellido,
                 telefono:"", correo:""};
      ir("nuevo");
    }}, "Actualizar mis datos"),
    h("button",{class:"btn pri grande", onclick:function(){
      ir(S.citaPrevia ? "cita" : "servicio");
    }}, "Continuar")));
}
function dato(k, val){
  return h("div",{class:"dato"}, h("span",{class:"k"},k), h("span",{class:"v"}, val));
}

/* ─────────────────── 2bis. registro / actualización ──────────────── */
function vNuevo(v){
  var n = S.nuevo, esNuevo = !n.cliente_id;
  v.appendChild(titulo(esNuevo ? "Cuéntenos quién es" : "Actualice sus datos",
    esNuevo ? "Es la primera vez que la vemos por aquí. Con esto queda registrada."
            : "Por seguridad no mostramos el celular ni el correo completos, "
              + "así que escríbalos de nuevo."));
  /* El campo que falta se marca en rojo, no solo el aviso de arriba: en una
     tablet el aviso queda lejos del campo y la clienta no sabe cuál es. */
  function campo(etq, el, clave){
    if (clave && S.campoMalo === clave){
      el.setAttribute("data-malo", "");
      el.setAttribute("aria-invalid", "true");
    }
    return h("label",{class:"campo" + (clave && S.campoMalo === clave ? " malo" : "")},
      h("span",null,etq), el);
  }
  function txt(clave, props){
    return h("input", Object.assign({type:"text", value:n[clave] || "",
      /* La marca se quita en cuanto la clienta toca ESE campo: que se le
         quede el rojo mientras lo corrige es peor que no marcarlo. */
      oninput:function(e){
        n[clave] = e.target.value;
        if (S.campoMalo === clave){ S.campoMalo = ""; S.error = "";
          e.target.removeAttribute("data-malo");
          e.target.removeAttribute("aria-invalid");
          var l = e.target.parentNode; if (l) l.className = "campo";
          var av = document.querySelector("#vista .aviso"); if (av) av.hidden = true; }
      }}, props || {}));
  }
  var tipos = (D && D.tipos_doc) || [{v:"CC",t:"Cédula de ciudadanía"}];
  var sel = h("select",{onchange:function(e){ n.tipo_doc = e.target.value; }});
  tipos.forEach(function(t){
    var o = h("option",{value:t.v}, t.t);
    if (t.v === (n.tipo_doc || "CC")) o.selected = true;
    sel.appendChild(o);
  });

  v.appendChild(h("div",{class:"tarjeta"},
    h("div",{class:"rejilla c2 campos"},
      campo("Nombre", txt("primer_nombre",{placeholder:"Escriba su nombre", autocapitalize:"words"}), "primer_nombre"),
      campo("Apellido", txt("primer_apellido",{placeholder:"Escriba su apellido", autocapitalize:"words"}), "primer_apellido"),
      campo("Tipo de documento", sel, "tipo_doc"),
      campo("Número de documento", txt("documento",
        esNuevo ? {inputmode:"numeric", placeholder:"Escriba su número de documento"}
                : {inputmode:"numeric", readonly:true,
                   /* Nombres viejos de cuando los colores se llamaban --fondo
                      y --tinta: no existen, así que el campo bloqueado se veía
                      idéntico a los que sí se pueden escribir. */
                   style:{background:"var(--bg-2)", color:"var(--ink-3)"}}), "documento"),
      campo("Celular", txt("telefono",{inputmode:"tel", placeholder:"Escriba su celular"}), "telefono"),
      campo("Correo", h("input",{type:"email", value:n.correo || "", inputmode:"email",
        placeholder:"Escriba su correo", autocapitalize:"off",
        oninput:function(e){
          n.correo = e.target.value;
          if (S.campoMalo === "correo"){ S.campoMalo = ""; S.error = "";
            e.target.removeAttribute("data-malo"); e.target.removeAttribute("aria-invalid");
            var l = e.target.parentNode; if (l) l.className = "campo";
            var av = document.querySelector("#vista .aviso"); if (av) av.hidden = true; }
        }}), "correo"))));
  v.appendChild(h("div",{class:"fila fin"},
    h("button",{class:"btn plano", onclick:function(){ ir(S.cliente ? "ficha" : "documento"); }}, "Atrás"),
    h("button",{class:"btn pri grande", onclick:guardarCliente}, "Guardar y continuar")));

/* Las reglas de los seis campos obligatorios, en UN solo sitio. Devuelve
   {clave, frase} del primero que falte, o null. Antes devolvía solo la frase;
   ahora también dice CUÁL campo es, para poder marcarlo en rojo sin tener las
   reglas escritas dos veces. */
var REGLAS_CLIENTE = [
  ["documento", function(n){ return !digitos(n.documento); },
   "Falta el número de documento."],
  ["documento", function(n){ var d = digitos(n.documento);
     return d.length < DOC_MIN || d.length > DOC_MAX; },
   "Revise el número de documento: debe tener entre " + 6 + " y " + 11 + " dígitos."],
  ["tipo_doc", function(n){ return !n.tipo_doc; },
   "Escoja el tipo de documento."],
  ["primer_nombre", function(n){ return String(n.primer_nombre||"").trim().length < 2; },
   "Falta su nombre."],
  ["primer_apellido", function(n){ return String(n.primer_apellido||"").trim().length < 2; },
   "Falta su apellido."],
  ["telefono", function(n){ return digitos(n.telefono).length < 10; },
   "El celular debe tener 10 dígitos."],
  ["correo", function(n){
     return !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(String(n.correo||"").trim()); },
   "Revise el correo, por favor."]
];
function digitos(v){ return String(v || "").replace(/\D/g, ""); }
function queFalta(n){
  for (var i = 0; i < REGLAS_CLIENTE.length; i++)
    if (REGLAS_CLIENTE[i][1](n))
      return {clave: REGLAS_CLIENTE[i][0], frase: REGLAS_CLIENTE[i][2]};
  return null;
}
/* Se mantiene por si algo la llama: devuelve la frase, como antes. */
function faltaDatos(n){ var f = queFalta(n); return f ? f.frase : ""; }

/* Los seis campos son obligatorios: si falta uno no se sigue, se dice cuál y
   además se le marca el campo y se le lleva el cursor. */
/* El cursor se va al campo que falta. Sin esto, en una tablet la clienta lee
   el aviso arriba y tiene que buscar a ojo cuál era. */
function enfocarCampoMalo(){
  setTimeout(function(){
    var el = document.querySelector("#vista [data-malo]");
    if (!el) return;
    try { el.focus({preventScroll:false}); } catch(e){ try{ el.focus(); }catch(e2){} }
    if (el.scrollIntoView) try { el.scrollIntoView({block:"center"}); } catch(e){}
  }, 60);
}
function guardarCliente(){
  var n = S.nuevo;
  var falta = queFalta(n);
  if (falta){
    S.error = falta.frase;
    S.campoMalo = falta.clave;
    pintar();
    enfocarCampoMalo();
    return;
  }
  S.campoMalo = "";
  S.error = ""; conCarga(pedir("/api/v2/autoservicio/cliente/guardar", {
    cliente_id: n.cliente_id || null, documento: n.documento, tipo_doc: n.tipo_doc,
    primer_nombre: n.primer_nombre, primer_apellido: n.primer_apellido,
    telefono: n.telefono, correo: n.correo
  }), function(j){
    S.cliente = Object.assign({}, S.cliente || {}, j.cliente,
      {documento:n.documento, tipo_doc:n.tipo_doc});
    S.doc = String(n.documento).replace(/\D/g,"");
    ir(S.citaPrevia ? "cita" : "servicio");
  });
}

/* ───────────── verificación por celular (reprogramar/cancelar) ───── */
function vVerificar(v){

  var visor = h("div",{class:"visor"});

    visor.textContent = "";
    if (S.telefono) visor.appendChild(document.createTextNode(S.telefono));
    else visor.appendChild(h("span",{class:"vacio"},"— — — — — — — — — —"));

  });

    S.telefono = ""; repintar(); }}, "Borrar todo"));

    if (S.accion === "cancelar") ir("confirmar_cancelar");

/* ───────────────────────── 4. día y hora ─────────────────────────── */
function hoyISO(){ return (D && D.hoy) || new Date().toISOString().slice(0,10); }
function masDias(iso, n){
  var p = iso.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
             "septiembre","octubre","noviembre","diciembre"];

function vCuando(v){
  var reprog = S.modo === "reprogramar";
  v.appendChild(titulo(reprog ? "Escoja el nuevo día" : "Escoja el día",

  rej.appendChild(h("button",{class:"opcion", style:{minHeight:"120px"},
    onclick:function(){ cargarHoras(hoyISO()); }},
    h("span",{class:"t", style:{fontSize:"24px"}}, reprog ? "Hoy mismo" : "Hoy"),
    h("span",{class:"d"}, "Lo que queda libre de hoy")));
  rej.appendChild(h("button",{class:"opcion", style:{minHeight:"120px"},
    onclick:function(){ S.mes = hoyISO().slice(0,7); ir("calendario"); }},
    h("span",{class:"t", style:{fontSize:"24px"}}, "Otro día"),
    h("span",{class:"d"}, "Escoja la fecha en el calendario")));
  v.appendChild(rej);
}

function vCalendario(v){
  v.appendChild(titulo("Escoja el día", S.servicio ? S.servicio.nombre : ""));
  var cont = h("div",{class:"tarjeta"});
  var cal = h("div",{class:"cal"});
  var hoy = hoyISO();
  function dibujar(){
    cal.textContent = "";
    var a = +S.mes.slice(0,4), m = +S.mes.slice(5,7);
    var primero = new Date(a, m-1, 1), ultimo = new Date(a, m, 0).getDate();
    var desplaz = (primero.getDay() + 6) % 7;
    cal.appendChild(h("div",{class:"cab"},
      h("button",{"aria-label":"Mes anterior", onclick:function(){
        var d = new Date(a, m-2, 1);
        S.mes = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
        dibujar(); }}, svg('<path d="M15 5l-7 7 7 7"/>')),
      h("div",{class:"m"}, MESES[m-1] + " " + a),
      h("button",{"aria-label":"Mes siguiente", onclick:function(){
        var d = new Date(a, m, 1);
        S.mes = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
        dibujar(); }}, svg('<path d="M9 5l7 7-7 7"/>'))));
    var sem = h("div",{class:"sem"});
    ["L","M","X","J","V","S","D"].forEach(function(x){ sem.appendChild(h("span",null,x)); });
    cal.appendChild(sem);
    var dias = h("div",{class:"dias"});
    for (var i=0;i<desplaz;i++) dias.appendChild(h("div"));
    for (var dd=1; dd<=ultimo; dd++){
      (function(dd){
        var f = S.mes + "-" + String(dd).padStart(2,"0");
        var pasado = f < hoy, lejos = f > masDias(hoy, 90);
        dias.appendChild(h("button",{
          class: S.fecha === f ? "on" : "",
          disabled: (pasado || lejos) ? true : null,
          onclick:function(){ cargarHoras(f); }}, String(dd)));
      })(dd);
    }
    cal.appendChild(dias);
  }
  dibujar();
  cont.appendChild(cal);
  v.appendChild(cont);
  v.appendChild(h("div",{class:"fila fin"},
    h("button",{class:"btn plano", onclick:function(){ ir("cuando"); }}, "Atrás")));
}

function cargarHoras(fecha, silencioso){
  S.fecha = fecha;
  conCarga(pedir("/api/v2/autoservicio/horas",
    {servicio:S.servicio.id, fecha:fecha}), function(j){
    S.horas = j.horas || [];
    S.fechaLarga = j.fecha_larga; S.cuando = j.cuando;
    if (silencioso) S.error = "Esa hora se acabó de ocupar. Estas son las que quedan.";
    ir("horas");
  });
}

  v.appendChild(rej);

    h("button",{class:"btn plano", onclick:function(){
      S.mes = (S.fecha || hoyISO()).slice(0,7); ir("calendario"); }},
      "Ver otro día")));

function vEspecialista(v){
  v.appendChild(titulo("Escoja con quién desea atenderse",

  S.libres.forEach(function(e){
    rej.appendChild(h("button",{class:"opcion", onclick:function(){ escoger(e); }},
      h("span",{class:"t"}, e.nombre),

function horaLarga(hm){
  var x = S.horas.filter(function(o){ return o.hora === hm; })[0];
  return x ? x.hora_larga : hm;
}
function escoger(esp){
  S.especialista = esp;
  conCarga(pedir("/api/v2/autoservicio/reservar", {
    servicio:S.servicio.id, fecha:S.fecha, hora:S.hora,
    especialista: esp ? esp.id : null
  }), function(j){
    S.reserva = j.reserva;
    if (!esp){
      var elegida = S.libres.filter(function(e){ return e.id === j.especialista; })[0];
      S.especialista = elegida || {id:j.especialista, nombre:"La primera disponible"};
    }
    ir("resumen");
  });
}
