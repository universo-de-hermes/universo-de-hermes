<!doctype html><html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda CJ Medical</title><style>:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}html,body{height:100%}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>/* ==========================================================================
   Capa de datos de la agenda contra la API del VPS.
   Sustituye claude.use("db"|"user"|"downloads") por llamadas HTTP, sin tocar
   el resto de la agenda: la página sigue pidiendo doc()/collection() y esta
   capa traduce a la API.

   ── SI ALGO NO CUADRA, SE CAMBIA AQUÍ ─────────────────────────────────────
   Las rutas están en RUTAS. Las respuestas se normalizan de snake_case a
   camelCase y lo que se envía se pasa a snake_case, así que da igual la
   convención de cada endpoint.
   ========================================================================== */
(function(){
"use strict";

var P = new URLSearchParams(location.search);

/* Servida desde el mismo dominio de la API → rutas relativas, sin CORS.
   ?api=https://otro.dominio  manda sobre eso. */
var BASE = P.has("api") ? P.get("api")
        : (/(^|\.)universojota\.tech$/i.test(location.hostname) ? "" : "https://agenda.universojota.tech");
var PRE  = "/api/v2";        /* nginx borra "/api/", la API responde igual en /v2 */
var REFRESCO = 12000;        /* cada cuánto se relee el día, en ms */

function u(p){ return BASE + PRE + p; }
var RUTAS = {
  datos:          function(){ return u("/datos"); },
  agenda:         function(sede,fecha){ return u("/agenda/"+encodeURIComponent(sede||"todas")+"/"+fecha); },
  citasRango:     function(desde,hasta){ return u("/citas?desde="+desde+"&hasta="+hasta+"&limite=2000"); },
  clientes:       function(q,lim){ return u("/clientes?limite="+(lim||400)+(q?"&buscar="+encodeURIComponent(q):"")); },
  clienteDetalle: function(id){ return u("/clientes/"+encodeURIComponent(id)); },
  clienteGuardar: function(id){ return u("/clientes/"+encodeURIComponent(id)); },   /* PUT crea o actualiza */
  citaAgendar:    function(){ return u("/citas/agendar"); },
  citaEstado:     function(){ return u("/citas/estado"); },
  citaMover:      function(id){ return u("/citas/"+encodeURIComponent(id)); },      /* PUT */
  citaAnular:     function(id){ return u("/citas/"+encodeURIComponent(id)); },      /* DELETE */
  citaBloqueo:    function(){ return u("/citas/bloqueo"); },
  bloqueoRango:   function(){ return u("/citas/bloqueo-rango"); },
  bloqueos:       function(q){ return u("/citas/bloqueos" + q); },
  /* Cupos que una clienta está apartando ahora mismo desde la tablet. Si el
     servidor todavía no tiene este endpoint, la agenda sigue igual: lo pide,
     se encuentra un 404 y no dibuja nada. */
  reservas:       function(fecha,sede){ return u("/reservas?fecha="+fecha+
                    (sede?"&sede="+encodeURIComponent(sede):"")); },
  horariosFecha:  function(q){ return u("/horarios-fecha" + (q||"")); },
  horarioFecha:   function(id){ return u("/horarios-fecha/" + encodeURIComponent(id)); },
  indicadores:    function(anio,mes){ return u("/indicadores?anio="+anio+"&mes="+mes); },
  maestro:        function(col,id){ return u("/"+col+(id?"/"+encodeURIComponent(id):"")); },
  authYo:         function(){ return u("/auth/yo"); },
  authLogin:      function(){ return u("/auth/login"); },
  authLogout:     function(){ return u("/auth/logout"); },
  authClave:      function(){ return u("/auth/clave"); }
};

/* Lo que la API todavía no tiene. Todo lo demás ya funciona. */
var FALTA = {
  config: "guardar los ajustes en el servidor"
};

/* Columnas reales de cada tabla: lo que no esté aquí no se manda (la agenda
   guarda campos suyos, como el historial de citas del cliente, que en la base
   no son columnas y harían fallar el UPDATE). */
var COLUMNAS = {
  clientes: ["tipo_doc","documento","primer_nombre","segundo_nombre","primer_apellido",
             "segundo_apellido","telefono","correo","dia_nac","mes_nac","genero",
             "ciudad","sede_id","tipo_cliente","notas"],
  sedes: ["nombre","codigo","ciudad","direccion","telefono","hora_inicio","hora_fin",
          "puestos","capacidad_dia","dias_mes","activo"],
  servicios: ["nombre","codigo","duracion","precio","activo"],
  estados: ["nombre","color","tipo","inicial","transparente","orden","activo"],
  especialistas: ["nombres","apellidos","documento","correo","telefono","especialidad",
                  "color","activo","sedes","servicios","horarios"],
  usuarios: ["nombre","correo","rol","canal","sede_id","nota","activo","clave"]
};

/* ------------------------------------------------------------------ util -- */
function aCamel(k){ return String(k).replace(/_([a-z0-9])/g, function(_,c){ return c.toUpperCase(); }); }
function aSnake(k){ return String(k).replace(/([a-z0-9])([A-Z])/g, "$1_$2").toLowerCase(); }
function normalizar(v){
  if (Array.isArray(v)) return v.map(normalizar);
  if (v && typeof v === "object" && !(v instanceof Date)){
    var o = {};
    for (var k in v) o[aCamel(k)] = normalizar(v[k]);
    return o;
  }
  return v;
}
/* Acepta lista pelada, lista envuelta, u objeto indexado por id. */
function comoLista(j, claves){
  if (Array.isArray(j)) return j;
  if (!j || typeof j !== "object") return null;
  for (var i=0;i<claves.length;i++){
    var v = j[claves[i]];
    if (Array.isArray(v)) return v;
    if (v && typeof v === "object") return Object.keys(v).map(function(k){
      return Object.assign({id:k}, v[k]); });
  }
  var dentro = j.datos || j.data || j.result || j.resultado;
  return dentro ? comoLista(dentro, claves) : null;
}
function hhmm(t){
  var s = String(t==null?"":t), m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? (m[1].length===1?"0":"")+m[1]+":"+m[2] : s;
}
/* El estado de la agenda se declara con `const S`, así que no aparece en
   window: hay que leerlo por el identificador. */
function app(){ try { return S; } catch(e){ return null; } }
function quien(){ var a = app(); return (a && a.uid) || "agenda"; }

function aviso(txt, malo){
  if (typeof window.toast === "function") window.toast(txt, !!malo);
  else console[malo?"error":"log"](txt);
}
function noSoportado(cual){
  var e = new Error("NO_SOPORTADO");
  e.detalle = FALTA[cual] || cual;
  return e;
}
/* Deja solo las columnas reales y las pasa a snake_case. */
function paraTabla(tabla, d){
  var permitidas = COLUMNAS[tabla] || [], o = {};
  for (var k in d){
    var s = aSnake(k);
    if (permitidas.indexOf(s) < 0) continue;
    var v = d[k];
    if (v === undefined) continue;
    if (s === "dia_nac" || s === "mes_nac") v = (v === "" || v == null) ? null : Number(v) || null;
    o[s] = v;
  }
  if (Array.isArray(d.horarios)) o.horarios = d.horarios;   /* van tal cual */
  return o;
}

var ultimaRespuesta = null;

function pedir(url, opts){
  opts = opts || {};
  var ini = { method: opts.method || "GET",
              headers: {"accept":"application/json"},
              cache: "no-store", credentials: "include" };
  if (opts.body != null){
    ini.headers["content-type"] = "application/json";
    ini.body = JSON.stringify(opts.body);
  }
  return fetch(url, ini).then(function(r){
    return r.text().then(function(txt){
      var j = null;
      try { j = JSON.parse(txt); } catch(e){}
      ultimaRespuesta = {url:url, estado:r.status, cuerpo:txt.slice(0,1500), json:j};
      if (!r.ok){
        var e = new Error(mensajeDeError(j, txt, r.status));
        e.estado = r.status; e.cuerpo = j || txt;
        throw e;
      }
      if (j === null){ var e2 = new Error("La respuesta no es JSON"); e2.cuerpo = txt; throw e2; }
      return j;
    });
  });
}

var MENSAJES = {
  CUPO_TOMADO:      "Ese horario acaba de ocuparse. Escoge otro.",
  CUPO_APARTADO:    "Otra persona está tomando ese horario en este momento.",
  FUERA_DE_HORARIO: "La especialista no atiende a esa hora en esa sede.",
  ALMUERZO:         "Ese horario cae en el almuerzo.",
  CLIENTE_NO_EXISTE:"No encontré ese cliente.",
  HORA_INVALIDA:    "La hora de fin tiene que ser posterior a la de inicio.",
  CITA_NO_EXISTE:   "Esa cita ya no existe.",
  ESTADO_NO_EXISTE: "Ese estado no existe.",
  FALTA_DOCUMENTO:  "El cliente necesita número de documento.",
  DATOS_INCORRECTOS:"El correo o la contraseña no coinciden.",
  CLAVE_CORTA:      "La contraseña debe tener al menos 8 caracteres.",
  SOLO_ADMIN:       "Esa parte es solo del administrador.",
  SIN_SESION:       "Se cerró la sesión. Hay que entrar de nuevo."
};
function mensajeDeError(j, txt, estado){
  var crudo = (j && (j.detail || j.error || j.message || j.mensaje)) || txt || "";
  if (typeof crudo === "object") crudo = JSON.stringify(crudo);
  crudo = String(crudo);
  for (var k in MENSAJES) if (crudo.indexOf(k) >= 0) return MENSAJES[k];
  if (estado === 404) return "La API no reconoce esa dirección (404).";
  if (estado === 405) return "La API no acepta ese método (405).";
  if (estado >= 500)  return "El servidor devolvió un error (" + estado + ").";
  return crudo.slice(0,200) || ("Error " + estado);
}

/* ------------------------------------------------------- almacén y avisos -- */
var store = { sedes:{}, especialistas:{}, servicios:{}, estados:{},
              clientes:{}, usuarios:{}, pendientes:{}, config:{}, citas:{},
              apartados:[] };
var subs = [];

function snapDoc(col,id){
  var d = store[col] && store[col][id];
  return { id:id, exists:!!d, data:function(){ return d; },
           metadata:{fromCache:false,hasPendingWrites:false} };
}
function cmp(op,a,b){
  switch(op){
    case "==": return a===b;  case "!=": return a!==b;
    case "<":  return a<b;    case "<=": return a<=b;
    case ">":  return a>b;    case ">=": return a>=b;
    case "in": return (b||[]).indexOf(a)>=0;
    case "not-in": return (b||[]).indexOf(a)<0;
    case "array-contains": return Array.isArray(a) && a.indexOf(b)>=0;
    default: return true;
  }
}
function snapQ(col,q){
  var ids = Object.keys(store[col]||{});
  (q.w||[]).forEach(function(c){
    ids = ids.filter(function(i){ return cmp(c[1], (store[col][i]||{})[c[0]], c[2]); });
  });
  if (q.ord) ids.sort(function(a,b){
    var x=(store[col][a]||{})[q.ord], y=(store[col][b]||{})[q.ord];
    return String(x==null?"":x).localeCompare(String(y==null?"":y));
  });
  else ids.sort();
  ids = ids.slice(0, q.lim||1000);
  var docs = ids.map(function(i){ return snapDoc(col,i); });
  return { docs:docs, size:docs.length, empty:!docs.length,
           docChanges:function(){ return []; },
           metadata:{fromCache:false,hasPendingWrites:false} };
}
function avisar(col,id){
  subs.forEach(function(s){
    if (s.col !== col) return;
    if (s.id !== null){ if (s.id === id) setTimeout(function(){ s.cb(snapDoc(col,id)); },0); }
    else setTimeout(function(){ s.cb(snapQ(col,s.q)); },0);
  });
}
function poner(col,id,doc){
  store[col] = store[col] || {};
  store[col][id] = doc;
  avisar(col,id);
}

/* ----------------------------------------------------------- los maestros -- */
function limpiar(col, d){
  if (col === "especialistas"){
    d.horarios = (d.horarios||[]).map(function(h){
      return { id:h.id, dia:Number(h.dia),
               sedeId: h.sedeId || h.sede || "",
               desde: hhmm(h.desde), hasta: hhmm(h.hasta),
               almDesde: h.almDesde ? hhmm(h.almDesde) : "",
               almHasta: h.almHasta ? hhmm(h.almHasta) : "" };
    });
    if (!Array.isArray(d.sedes) || !d.sedes.length){
      var vistas = {};
      d.horarios.forEach(function(h){ if (h.sedeId) vistas[h.sedeId] = 1; });
      d.sedes = Object.keys(vistas);
    }
    if (!Array.isArray(d.servicios)) d.servicios = [];
    if (d.activo === undefined) d.activo = true;
  }
  if (col === "servicios"){ d.duracion = Number(d.duracion) || 30; }
  if (col === "estados"){ d.orden = Number(d.orden) || 0; }
  if (col === "sedes"){
    d.puestos = Number(d.puestos) || 1;
    d.horaInicio = hhmm(d.horaInicio); d.horaFin = hhmm(d.horaFin);
  }
  if (d.activo === undefined) d.activo = true;
  return d;
}

function cargarMaestros(){
  return pedir(RUTAS.datos()).then(function(j){
    var n = normalizar(j);
    var grupos = {
      sedes:         comoLista(n, ["sedes"]),
      servicios:     comoLista(n, ["servicios"]),
      estados:       comoLista(n, ["estados"]),
      especialistas: comoLista(n, ["especialistas"])
    };
    if (!grupos.sedes || !grupos.especialistas)
      throw Object.assign(new Error("La respuesta de /datos no trae sedes ni especialistas"),
                          {diagnostico:true});
    ["sedes","servicios","estados","especialistas"].forEach(function(col){
      store[col] = {};
      (grupos[col]||[]).forEach(function(d){
        if (d && d.id) store[col][d.id] = limpiar(col, d);
      });
      avisar(col, null);
    });
    var guardada = {};
    try { guardada = JSON.parse(localStorage.getItem("cj-config") || "{}"); } catch(e){}
    var primera = Object.keys(store.sedes)[0] || "";
    poner("config","app", Object.assign({
      nombre:"CJ Medical", horaInicio:"09:00", horaFin:"20:00",
      slot:30, zoom:1.5, fueraDeHorario:false,
      sedeDefault: primera, importado:"cjm-2026-06"
    }, guardada));
  });
}

function cargarClientes(q){
  return pedir(RUTAS.clientes(q, q ? 200 : 400)).then(function(j){
    var lista = comoLista(normalizar(j), ["clientes","resultados","items"]) || [];
    var hubo = false;
    lista.forEach(function(c){
      if (!c.id) return;
      var antes = store.clientes[c.id];
      c.citas = (antes && antes.citas) || c.citas || [];
      store.clientes[c.id] = c; hubo = true;
    });
    if (hubo) avisar("clientes", null);
    return lista.length;
  });
}

/* ------------------------------------------------------------- el día ----- */
function sedesAConsultar(){
  var a = app(); var sel = (a && a.sede) || "";
  return sel ? [sel] : ["todas"];
}
function citaDesdeApi(c, fecha){
  return {
    id: c.id || c.citaId,
    tipo: c.tipo || "cita",
    fecha: String(c.fecha || fecha || "").slice(0,10),
    inicio: hhmm(c.inicio), fin: hhmm(c.fin),
    especialistaId: c.especialistaId || "",
    sedeId: c.sedeId || "",
    servicioId: c.servicioId || "",
    clienteId: c.clienteId || "",
    estadoId: c.estadoId || "",
    canal: c.canal || "", asignadaPor: c.asignadaPor || "",
    notas: c.notas || "", motivo: c.motivo || ""
  };
}
function clienteDesdeCita(c){
  if (!c.clienteId || store.clientes[c.clienteId]) return false;
  var partes = String(c.clienteNombre || "").trim().split(/\s+/);
  store.clientes[c.clienteId] = {
    id: c.clienteId,
    primerNombre: partes[0] || "",
    segundoNombre: partes.length > 3 ? partes[1] : "",
    primerApellido: partes.length > 3 ? partes[2] : (partes[1] || ""),
    segundoApellido: partes.length > 3 ? partes.slice(3).join(" ") : (partes[2] || ""),
    documento: c.documento || "", telefono: c.telefono || "",
    correo: "", tipoDoc: "CC", notas: "", citas: [], parcial: true
  };
  return true;
}

/* Los horarios puntuales de un día viajan dentro del propio día, así la
   agenda los recibe por el mismo canal que las citas y se refrescan solos.
   Si la API todavía no tiene la ruta (404), se sigue sin ellos. */
function horariosDeFecha(fecha, esp, sede){
  var q = "?desde=" + fecha + "&hasta=" + fecha
        + (esp ? "&especialista=" + encodeURIComponent(esp) : "")
        + (sede ? "&sede=" + encodeURIComponent(sede) : "");
  return pedir(RUTAS.horariosFecha(q)).then(function(j){
    return (comoLista(normalizar(j), ["horarios","horariosFecha","items"]) || [])
      .map(function(h){
        return { id: h.id, fecha: String(h.fecha || fecha).slice(0,10),
                 especialistaId: h.especialistaId || h.especialista || "",
                 sedeId: h.sedeId || h.sede || "",
                 desde: hhmm(h.desde || h.inicio), hasta: hhmm(h.hasta || h.fin),
                 almDesde: h.almDesde ? hhmm(h.almDesde) : "",
                 almHasta: h.almHasta ? hhmm(h.almHasta) : "",
                 nota: h.nota || "" };
      });
  }).catch(function(e){
    if (e.estado === 404 || e.estado === 403) return [];
    console.warn("horarios por fecha", e.message);
    return [];
  });
}

var diaEnCurso = null;
function cargarDia(fecha){
  var citas = Promise.all(sedesAConsultar().map(function(s){
    return pedir(RUTAS.agenda(s, fecha)).catch(function(e){
      if (e.estado === 404) return [];
      throw e;
    });
  }));
  return Promise.all([citas, horariosDeFecha(fecha)]).then(function(par){
    var res = par[0], horarios = par[1];
    var items = {}, nuevos = false;
    res.forEach(function(j){
      (comoLista(normalizar(j), ["citas","items","agenda"]) || []).forEach(function(c){
        var cita = citaDesdeApi(c, fecha);
        if (!cita.id) return;
        items[cita.id] = cita;
        if (clienteDesdeCita(Object.assign({}, normalizar(c), cita))) nuevos = true;
      });
    });
    store.citas[fecha] = { fecha: fecha, items: items, horarios: horarios };
    if (nuevos) avisar("clientes", null);
    avisar("citas", fecha);
    return items;
  });
}
function refrescarDia(){
  if (!diaEnCurso) return Promise.resolve();
  return Promise.all([
    cargarDia(diaEnCurso).catch(function(e){ console.warn("día", e.message); }),
    cargarReservas(diaEnCurso)
  ]);
}

/* Los cupos que una clienta está apartando en la tablet. Hoy ya BLOQUEAN —
   huecos_del_dia los descuenta— pero no se veían, así que recepción miraba un
   hueco vacío que en realidad alguien estaba usando y no entendía por qué no
   lo podía tomar. Solo cuentan los vivos (expira_en > now()), la misma
   condición que usa la disponibilidad.

   Si el endpoint todavía no está en el servidor, esto se queda callado: la
   agenda funciona igual y simplemente no dibuja nada. */
var apartadosRotos = false;
function cargarReservas(fecha){
  if (apartadosRotos) return Promise.resolve();
  return pedir(RUTAS.reservas(fecha, S.sede || "")).then(function(j){
    var lista = comoLista(normalizar(j), ["reservas","items"]) || [];
    /* normalizar() ya pasó especialista_id → especialistaId, igual que en las
       citas: aquí se usa el mismo estilo que el resto de la agenda. */
    store.apartados = lista.filter(function(r){ return r && r.especialistaId && r.inicio; });
    if (typeof render === "function") render();
  }).catch(function(e){
    /* una sola vez: si no está el endpoint no se insiste cada 12 segundos */
    apartadosRotos = true;
    console.warn("apartados: el servidor todavía no los sirve (" + (e && e.message) + ")");
  });
}

/* ---------------------------------------------------------- escrituras ---- */
function cuerpoAgendar(c){
  return { cliente_id: c.clienteId, especialista: c.especialistaId,
           sede: c.sedeId, fecha: c.fecha, inicio: c.inicio, fin: c.fin,
           servicio: c.servicioId || null,
           canal: c.canal || "Recepcionista",
           por: quien(),
           notas: c.notas || "" };
}
function cuerpoBloqueo(c){
  return { especialista: c.especialistaId, sede: c.sedeId, fecha: c.fecha,
           inicio: c.inicio, fin: c.fin,
           motivo: c.notas || c.motivo || "Bloqueo",
           por: quien() };
}
function cuerpoEstado(c){
  return { cita_id: c.id, estado: c.estadoId,
           por: quien(),
           motivo: c.motivo || "" };
}
function cuerpoMover(c){
  return { fecha: c.fecha, inicio: c.inicio, fin: c.fin,
           especialista_id: c.especialistaId, sede_id: c.sedeId,
           servicio_id: c.servicioId || null, notas: c.notas || "",
           por: quien() };
}

var CAMPOS_CITA = ["fecha","inicio","fin","especialistaId","sedeId","servicioId",
                   "clienteId","notas"];

function guardarItem(fecha, cita){
  var dia = store.citas[fecha] || {items:{}};
  var antes = dia.items[cita.id];

  if (!antes){
    var esBloqueo = cita.tipo === "bloqueo";
    return pedir(esBloqueo ? RUTAS.citaBloqueo() : RUTAS.citaAgendar(),
                 {method:"POST", body: esBloqueo ? cuerpoBloqueo(cita) : cuerpoAgendar(cita)})
           .then(refrescarDia);
  }
  var cambioEstado = antes.estadoId !== cita.estadoId;
  var cambioOtra = CAMPOS_CITA.some(function(k){ return antes[k] !== cita[k]; });

  var cadena = Promise.resolve();
  if (cambioOtra)
    cadena = cadena.then(function(){
      return pedir(RUTAS.citaMover(cita.id), {method:"PUT", body: cuerpoMover(cita)});
    });
  if (cambioEstado)
    cadena = cadena.then(function(){
      return pedir(RUTAS.citaEstado(), {method:"POST", body: cuerpoEstado(cita)});
    });
  if (!cambioOtra && !cambioEstado) return Promise.resolve();
  return cadena.then(refrescarDia);
}

/* ------------------------------------------------------- doc / collection -- */
function refDoc(col,id){
  return {
    id:id, path:col+"/"+id,
    get: function(){
      if (col === "citas" && !store.citas[id])
        return cargarDia(id).then(function(){ return snapDoc(col,id); })
                            .catch(function(){ return snapDoc(col,id); });
      return Promise.resolve(snapDoc(col,id));
    },
    set: function(d){ return escribir(col,id,d,"set"); },
    update: function(d){ return escribir(col,id,d,"update"); },
    delete: function(){
      if (col === "pendientes") return Promise.resolve();
      if (col === "citas")      return Promise.resolve();
      return pedir(RUTAS.maestro(col,id), {method:"DELETE"}).then(function(){
        delete store[col][id]; avisar(col,id);
      });
    },
    acquire: function(){ return Promise.resolve({acquired:false}); },
    onSnapshot: function(cb){
      var s = {col:col, id:id, cb:cb};
      subs.push(s);
      if (col === "citas"){
        diaEnCurso = id;
        cargarDia(id).catch(function(e){ aviso("No pude leer la agenda: "+e.message, true); });
      }
      setTimeout(function(){ cb(snapDoc(col,id)); },5);
      return function(){
        var i = subs.indexOf(s); if (i>=0) subs.splice(i,1);
        if (col === "citas" && diaEnCurso === id) diaEnCurso = null;
      };
    },
    collection: function(p){ return consulta(col+"/"+id+"/"+p); }
  };
}

function escribir(col,id,d,modo){
  if (col === "citas"){
    var entran = d.items || {};
    var ids = Object.keys(entran);
    /* set con el día completo = alguien anuló una cita: la que falta se anula */
    if (modo === "set"){
      var tenia = Object.keys((store.citas[id]||{}).items || {});
      var idas = tenia.filter(function(k){ return ids.indexOf(k) < 0; });
      if (idas.length)
        return Promise.all(idas.map(function(k){
          return pedir(RUTAS.citaAnular(k), {method:"DELETE"});
        })).then(refrescarDia);
    }
    if (!ids.length) return Promise.resolve();
    return guardarItem(id, entran[ids[0]]);
  }
  if (col === "config"){
    var actual = store.config.app || {};
    var nuevo = modo === "set" ? d : Object.assign({}, actual, d);
    poner("config","app", nuevo);
    try { localStorage.setItem("cj-config", JSON.stringify(nuevo)); } catch(e){}
    if (modo === "set") aviso("Ajustes guardados en este navegador: la API todavía no los almacena.");
    return Promise.resolve();
  }
  if (col === "pendientes") return Promise.resolve();

  if (!COLUMNAS[col]) return Promise.reject(noSoportado(col));
  var cuerpo = paraTabla(col, d);
  if (!Object.keys(cuerpo).length) return Promise.resolve();
  if (col === "clientes" && modo === "set" && !cuerpo.documento)
    return Promise.reject(Object.assign(new Error(MENSAJES.FALTA_DOCUMENTO), {estado:400}));
  var ruta = (col === "clientes") ? RUTAS.clienteGuardar(id) : RUTAS.maestro(col, id);
  return pedir(ruta, {method:"PUT", body: cuerpo}).then(function(j){
    var n = limpiar(col, normalizar(j));
    if (n && n.id){
      var antes = store[col][n.id] || {};
      if (col === "clientes") n.citas = antes.citas || n.citas || [];
      store[col][n.id] = n;
      avisar(col, n.id);
    }
    if (col === "usuarios") cargarUsuarios().catch(function(){});
    else cargarMaestros().catch(function(){});
  });
}

function consulta(col){
  var q = {w:[], ord:null, lim:1000};
  var o = {
    where: function(f,op,v){ q.w.push([f,op,v]); return o; },
    orderBy: function(f){ q.ord=f; return o; },
    limit: function(n){ q.lim=n; return o; },
    get: function(){
      if (col === "citas"){
        /* rango de fechas: indicadores del mes y buscador de cupos */
        var desde = null, hasta = null;
        q.w.forEach(function(c){
          if (c[0] !== "fecha") return;
          if (c[1] === ">=" || c[1] === ">") desde = c[2];
          if (c[1] === "<=" || c[1] === "<") hasta = c[2];
        });
        if (!desde) return Promise.resolve(snapDias(Object.keys(store.citas)));
        return pedir(RUTAS.citasRango(desde, hasta || desde)).then(function(j){
          var lista = comoLista(normalizar(j), ["citas","items"]) || [];
          var dias = {};
          lista.forEach(function(c){
            var cita = citaDesdeApi(c);
            if (!cita.id || !cita.fecha) return;
            (dias[cita.fecha] = dias[cita.fecha] || {fecha:cita.fecha, items:{}})
              .items[cita.id] = cita;
            clienteDesdeCita(Object.assign({}, normalizar(c), cita));
          });
          Object.keys(dias).forEach(function(f){
            if (f !== diaEnCurso) store.citas[f] = dias[f];
          });
          return snapDias(Object.keys(dias).filter(function(f){
            return (!desde || f >= desde) && (!hasta || f <= hasta); }));
        }).catch(function(e){
          console.warn("rango de citas", e.message);
          return snapDias(Object.keys(store.citas));
        });
      }
      return Promise.resolve(snapQ(col,q));
    },
    doc: function(id){ return refDoc(col, id || ("x"+Math.random().toString(36).slice(2))); },
    add: function(d){
      var id = (col.slice(0,3) + "_" + Math.random().toString(36).slice(2));
      return escribir(col, id, d, "set").then(function(){ return refDoc(col,id); });
    },
    onSnapshot: function(cb){
      var s = {col:col, id:null, q:q, cb:cb};
      subs.push(s);
      setTimeout(function(){ cb(snapQ(col,q)); },5);
      return function(){ var i=subs.indexOf(s); if (i>=0) subs.splice(i,1); };
    }
  };
  return o;
}
function snapDias(fechas){
  var docs = fechas.sort().map(function(f){ return snapDoc("citas", f); });
  return { docs:docs, size:docs.length, empty:!docs.length,
           docChanges:function(){ return []; }, metadata:{} };
}

var descargas = {
  save: function(req){
    try{
      var d = req.data;
      var b = (d instanceof Blob) ? d
            : (d instanceof ArrayBuffer || ArrayBuffer.isView(d)) ? new Blob([d])
            : new Blob([String(d)], {type:"text/plain;charset=utf-8"});
      var url = URL.createObjectURL(b);
      var a = document.createElement("a");
      a.href = url; a.download = req.filename || "archivo";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      return Promise.resolve({status:"saved"});
    } catch(e){ return Promise.reject({code:"unavailable", message:String(e)}); }
  }
};

/* El perfil del cliente muestra su historial; la lista no lo trae, así que lo
   pedimos justo antes de abrirlo. */
function engancharPerfil(){
  if (typeof window.perfilCliente !== "function" || window.__perfilEnganchado) return;
  window.__perfilEnganchado = true;
  var original = window.perfilCliente;
  window.perfilCliente = function(c){
    var r = original.apply(this, arguments);
    if (c && c.id) pedir(RUTAS.clienteDetalle(c.id)).then(function(j){
      var n = normalizar(j);
      if (!n || !n.id) return;
      n.citas = (comoLista(n.citas || [], ["citas"]) || []).map(function(x){
        return { id:x.citaId || x.id, fecha:String(x.fecha||"").slice(0,10),
                 inicio:hhmm(x.inicio), sedeId:x.sedeId || "",
                 especialistaId:x.especialistaId || "",
                 servicioId:x.servicioId || "", estadoId:x.estadoId || "" };
      });
      store.clientes[n.id] = Object.assign({}, store.clientes[n.id], n, {parcial:false});
      avisar("clientes", n.id);
      if (typeof window.render === "function") window.render();
    }).catch(function(e){ console.warn("ficha del cliente", e.message); });
    return r;
  };
}
/* Buscar clientes más allá de los que ya están cargados. */
var buscando = null, ultimaBusqueda = "";
function engancharBuscador(){
  document.addEventListener("input", function(ev){
    var t = ev.target;
    if (!t || t.id !== "q-buscador") return;
    var q = String(t.value||"").trim();
    if (q.length < 3 || q === ultimaBusqueda) return;
    ultimaBusqueda = q;
    clearTimeout(buscando);
    buscando = setTimeout(function(){ cargarClientes(q).catch(function(){}); }, 350);
  }, true);
}

var listo = pedir(RUTAS.authYo()).catch(function(e){
  if (e.estado === 401) return {sesion:false};
  throw e;
}).then(function(y){
  if (!y.sesion) return pantallaDeEntrada(!!y.sinUsuarios);
  var us = y.usuario || {};
  YO.id = us.id || "usuario";
  YO.name = us.nombre || us.correo || "Usuario";
  YO.email = us.correo || null;
  ADMIN = us.rol === "admin";
  return cargarMaestros().then(function(){
    return Promise.all([
      cargarClientes().catch(function(e){ console.warn("clientes", e.message); }),
      ADMIN ? cargarUsuarios() : null
    ]);
  }).then(function(){
    setInterval(function(){
      /* si la pestaña está escondida no se pide nada: no sirve de nada y
         gasta servidor */
      if (document.hidden) return;
      refrescarVista();
    }, REFRESCO);
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) refrescarVista();
    });
    setTimeout(function(){
      engancharPerfil(); engancharBuscador(); engancharSalir();
      if (ADMIN) montarUsuarios();
    }, 1200);
  });
}).catch(function(e){
  console.error(e);
  var pintar = function(){ pantallaDeError(e); };
  if (document.body) pintar(); else document.addEventListener("DOMContentLoaded", pintar);
  throw e;
});

/* Si la sesión se vence mientras alguien trabaja, mejor decirlo y volver a
   la entrada que dejar que cada clic falle en silencio. */
var avisadoSinSesion = false;
function vigilarSesion(e){
  if (!e || e.estado !== 401 || avisadoSinSesion) return;
  avisadoSinSesion = true;
  aviso("Se cerró la sesión. Vuelve a entrar.", true);
  setTimeout(function(){ location.reload(); }, 2500);
}

window.addEventListener("unhandledrejection", function(ev){
  var r = ev.reason;
  if (r && r.message === "NO_SOPORTADO"){
    aviso("Todavía no se puede " + r.detalle + " desde aquí: falta en el servidor.", true);
    ev.preventDefault();
  } else if (r && r.message){
    vigilarSesion(r);
    aviso(r.message, true);
    ev.preventDefault();
  }
});

window.__extra = {

          + (o.sede ? "&sede=" + encodeURIComponent(o.sede) : "");

:root{
  --f-sans:"Neue Montreal",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-data:"Exo","Neue Montreal",ui-monospace,monospace;

  --bg:#EFE9E5; --bg-2:#F8F4F2;
  --ink:#2A2320; --ink-2:#5C514C; --ink-3:#8A7C75;
  --line:rgba(42,35,32,.13); --line-2:rgba(42,35,32,.07);
  --glass:rgba(255,253,252,.58); --glass-2:rgba(255,253,252,.34);
  --glass-3:rgba(255,255,255,.86); --glass-hi:rgba(255,255,255,.95);
  --shadow:0 26px 60px -24px rgba(70,46,38,.32), 0 6px 18px -8px rgba(70,46,38,.14);
  --shadow-sm:0 10px 26px -14px rgba(70,46,38,.30);
  --brand:#AD6450; --brand-2:#C88878; --brand-3:#E8A898; --brand-ink:#FFF7F4;
  --blob-a:rgba(200,136,120,.62); --blob-b:rgba(240,176,152,.52); --blob-c:rgba(126,108,101,.24);
  --fill:.20; --fill-2:.11;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14100E; --bg-2:#1C1613;
  --ink:#F4EDE9; --ink-2:#BFB2AB; --ink-3:#8E817B;
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.07);
  --glass:rgba(48,39,35,.56); --glass-2:rgba(48,39,35,.34);
  --glass-3:rgba(72,59,52,.74); --glass-hi:rgba(255,255,255,.22);
  --shadow:0 30px 70px -26px rgba(0,0,0,.76), 0 6px 20px -8px rgba(0,0,0,.5);
  --shadow-sm:0 12px 28px -16px rgba(0,0,0,.7);
  --brand:#E7A78F; --brand-2:#C88878; --brand-3:#F0B098; --brand-ink:#241A16;
  --blob-a:rgba(200,136,120,.44); --blob-b:rgba(240,176,152,.26); --blob-c:rgba(96,120,128,.22);
  --fill:.26; --fill-2:.15;
}}
:root[data-theme="dark"]{
  --bg:#14100E; --bg-2:#1C1613;
  --ink:#F4EDE9; --ink-2:#BFB2AB; --ink-3:#8E817B;
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.07);
  --glass:rgba(48,39,35,.56); --glass-2:rgba(48,39,35,.34);
  --glass-3:rgba(72,59,52,.74); --glass-hi:rgba(255,255,255,.22);
  --shadow:0 30px 70px -26px rgba(0,0,0,.76), 0 6px 20px -8px rgba(0,0,0,.5);
  --shadow-sm:0 12px 28px -16px rgba(0,0,0,.7);
  --brand:#E7A78F; --brand-2:#C88878; --brand-3:#F0B098; --brand-ink:#241A16;
  --blob-a:rgba(200,136,120,.44); --blob-b:rgba(240,176,152,.26); --blob-c:rgba(96,120,128,.22);
  --fill:.26; --fill-2:.15;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-weight:400;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
#blobs{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.95}
#blobs i{position:absolute;display:block;border-radius:50%}
#blobs i:nth-child(1){width:46vw;height:46vw;left:-6vw;top:-8vw;background:var(--blob-a)}
#blobs i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:6vh;background:var(--blob-b)}
#blobs i:nth-child(3){width:52vw;height:52vw;left:26vw;bottom:-22vw;background:var(--blob-c)}
#blobs i:nth-child(4){width:26vw;height:26vw;right:14vw;bottom:-6vw;background:var(--blob-a);opacity:.6}

/* ---------- vidrio ---------- */
.g{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--glass-hi),transparent 34%);opacity:.34}
.g>*{position:relative;z-index:1}
.g-2{background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm)}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;display:flex;height:100%;gap:14px;padding:14px;overflow:hidden}
#side{flex:0 0 244px;display:flex;flex-direction:column;gap:12px;padding:18px 14px;overflow:hidden}
.brandbox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 12px}
.brandbox img{width:132px;height:auto;display:block}
.brandbox small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.brandbox img.only-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .only-light{display:none}
  :root:not([data-theme="light"]) .only-dark{display:block}}
:root[data-theme="dark"] .only-light{display:none}
:root[data-theme="dark"] .only-dark{display:block}

nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
nav::-webkit-scrollbar{width:0}
.navlab{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:999px;border:1px solid transparent;
  background:none;color:var(--ink-2);font:inherit;font-size:13.5px;cursor:pointer;text-align:left;width:100%;
  transition:background .18s,color .18s,border-color .18s}
.nav svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav:hover{background:var(--glass-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--glass-3);color:var(--ink);border-color:var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-sm);font-weight:500}
.nav .cnt{margin-left:auto;font-family:var(--f-data);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

#main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
#top{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
#top h1{margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em}
#top .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.spacer{flex:1}
#view{flex:1;min-height:0;overflow:auto;padding-right:2px}
#view::-webkit-scrollbar{width:9px}
#view::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass-2);color:var(--ink);font:inherit;font-size:13px;padding:8px 16px;cursor:pointer;
  box-shadow:inset 0 1px 0 var(--glass-hi);transition:transform .14s,background .18s,border-color .18s;
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);white-space:nowrap}
.btn:hover{background:var(--glass-3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--brand);border-color:transparent;color:var(--brand-ink);font-weight:500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 20px -10px var(--brand-2)}
.btn.pri:hover{background:var(--brand-2)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.icon{padding:8px;width:34px;height:34px;justify-content:center}
.btn.danger{color:#C0544B;border-color:rgba(192,84,75,.35)}
:root[data-theme="dark"] .btn.danger{color:#F09A8E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:#F09A8E}}

.seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--glass-2);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi);flex-wrap:wrap}
.seg button{border:1px solid transparent;background:none;border-radius:999px;padding:6px 14px;font:inherit;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .16s,color .16s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--glass-3);color:var(--ink);border-color:var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-sm);font-weight:500}

input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background-color:var(--glass-2);
  border:1px solid var(--line);border-radius:14px;padding:9px 13px;width:100%;
  box-shadow:inset 0 1px 0 var(--glass-hi);transition:border-color .16s,background-color .16s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);background-color:var(--glass-3)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
select{appearance:none;cursor:pointer;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{resize:vertical;min-height:70px;border-radius:16px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500}
label.fl>span{padding-left:2px}
.req::after{content:"*";color:var(--brand);margin-left:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}

/* ---------- agenda ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:11px 14px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:var(--glass-2);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi)}
.datenav button{border:none;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--ink-2);
  display:grid;place-items:center}
.datenav button:hover{background:var(--glass-3);color:var(--ink)}
.datenav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.datenav .d{font-size:13px;font-weight:500;padding:0 8px;min-width:150px;text-align:center}
.datenav input[type=date]{width:auto;background:none;border:none;box-shadow:none;padding:4px 8px;font-size:12.5px;color:var(--ink-2)}

#gridwrap{overflow:auto;border-radius:var(--r-lg);height:100%}
#gridwrap::-webkit-scrollbar{width:10px;height:10px}
#gridwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
.agwrap{padding:0;overflow:hidden;height:100%;display:flex;flex-direction:column}
#grid{display:grid;min-width:max-content}
.gh{position:sticky;top:0;z-index:5;padding:10px 11px;background:var(--glass-3);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border-bottom:1px solid var(--line);border-left:1px solid var(--line-2)}
.gh:first-child{border-left:none}
.gh .n{font-size:12px;font-weight:500;line-height:1.25;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gh .m{font-size:10.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px}
.gh .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.gcorner{position:sticky;left:0;top:0;z-index:7}
.gtime{position:sticky;left:0;z-index:4;background:var(--glass-3);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border-right:1px solid var(--line);font-family:var(--f-data);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.gtime div{position:absolute;right:9px;transform:translateY(-50%);white-space:nowrap}
.gtime,.gcol{margin-top:13px}
.gcol{position:relative;border-left:1px solid var(--line-2);cursor:copy}
.gcol .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line-2);pointer-events:none}
.gcol .hr.half{border-top-style:dotted;opacity:.6}
.gcol .off{position:absolute;left:0;right:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,var(--line-2) 0 6px,transparent 6px 12px)}
.cita{position:absolute;left:3px;right:3px;border-radius:12px;padding:5px 8px 5px 11px;overflow:hidden;
  cursor:grab;border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:11.5px;line-height:1.3;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;
  transition:box-shadow .16s,transform .16s}
.cita:hover{box-shadow:var(--shadow);transform:translateY(-1px);z-index:3}
/* Cupo que una clienta está apartando en la tablet: se ve que está ocupado,
   pero a rayas y sin color de estado, para que no se confunda con una cita de
   verdad. No se puede tocar: no hay nada que editar todavía. */
.cita.apartado{cursor:default;z-index:1;border-style:dashed;
  border-color:color-mix(in srgb, var(--acento) 55%, transparent);
  background:repeating-linear-gradient(135deg,
    rgba(173,100,80,.16) 0 7px, rgba(173,100,80,.06) 7px 14px);
  color:var(--ink-2)}
.cita.apartado:hover{transform:none;box-shadow:var(--shadow-sm)}
.cita.apartado .who{font-weight:500;color:var(--ink-2)}
.cita.apartado .cuando{font-size:10.5px;color:var(--ink-3)}
.cita.drag{cursor:grabbing;opacity:.92;z-index:20;box-shadow:var(--shadow)}
.cita .rail{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.cita .who{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita .svc{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.cita .hr2{font-family:var(--f-data);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cita .menu{position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:50%;padding:0;
  border:1px solid var(--line);background:var(--glass-3);color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;opacity:0;transition:opacity .15s,transform .15s;
  box-shadow:var(--shadow-sm);z-index:2}
.cita .menu svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cita:hover .menu,.cita:focus-within .menu{opacity:1}
.cita .menu:hover{transform:scale(1.12)}
@media (hover:none){.cita .menu{opacity:.85}}
#pop{position:fixed;z-index:60;padding:9px;border-radius:20px;min-width:190px;
  display:flex;flex-direction:column;gap:3px;animation:rise .16s ease}
#pop .ph{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding:3px 10px 6px}
#pop button{display:flex;align-items:center;gap:9px;border:1px solid transparent;background:none;
  border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
#pop button:hover{background:var(--glass-2)}
#pop button[aria-pressed="true"]{background:var(--glass-3);border-color:var(--line);font-weight:500}
#pop i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.cita.bloq{cursor:default;background:var(--glass-2)!important;border-style:dashed}
.cita.bloq .who{color:var(--ink-3);font-weight:400;text-align:center}
/* bloqueo anulado: el horario volvió a estar libre, y se tiene que notar */
.cita.bloq.libre{background:transparent!important;opacity:.55}

/* ---------- chips, tablas, kpis ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px 3px 9px;
  font-size:11.5px;font-weight:500;border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding:0 12px 9px;white-space:nowrap}
.tbl td{padding:11px 12px;border-top:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .14s}
.tbl tbody tr:hover{background:var(--glass-2)}
.tbl .num{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.tblwrap{overflow-x:auto}
.cards{display:grid;gap:13px;align-items:start}
.cards.mosaico{display:block;column-count:3;column-gap:13px}
.cards.mosaico>*{break-inside:avoid;margin:0 0 13px;display:block;width:100%}
@media(max-width:1250px){.cards.mosaico{column-count:2}}
@media(max-width:820px){.cards.mosaico{column-count:1}}
.pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px}
.kpi{padding:16px 18px}
.kpi .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.kpi .v{font-family:var(--f-data);font-size:30px;font-weight:500;letter-spacing:-.02em;margin-top:7px;
  font-variant-numeric:tabular-nums;line-height:1}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.meter{height:7px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.bars{display:flex;flex-direction:column;gap:9px}
.bars.larga{max-height:330px;overflow-y:auto;padding-right:5px}
.bars.larga::-webkit-scrollbar{width:7px}
.bars.larga::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.barrow{display:grid;grid-template-columns:1fr 62px;gap:11px;align-items:center;font-size:12.5px}
.barrow .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.barrow .t>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .tr{height:7px;border-radius:999px;background:var(--line-2);overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:999px}
.barrow .n{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2);font-size:12px}
h2.sec{margin:0 0 14px;font-size:14.5px;font-weight:500;letter-spacing:-.01em}
h2.sec small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:3px;letter-spacing:0}
.empty{padding:46px 24px;text-align:center;color:var(--ink-3)}
.empty h3{margin:0 0 7px;font-size:15px;font-weight:500;color:var(--ink)}
.empty p{margin:0 auto 16px;max-width:42ch;font-size:13px}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(30,20,16,.34);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;
  align-items:center;justify-content:center;padding:18px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.sheet{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  animation:rise .24s cubic-bezier(.2,.8,.3,1);background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.sheet.wide{width:min(940px,100%)}
.sheet>header{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font-size:16px;font-weight:500;letter-spacing:-.01em}
.sheet>header .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.sheet .body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.sheet .body::-webkit-scrollbar{width:9px}
.sheet .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.sheet>footer{display:flex;gap:9px;padding:15px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.x{border:none;background:none;color:var(--ink-3);cursor:pointer;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;font-size:19px;line-height:1}
.x:hover{background:var(--glass-2);color:var(--ink)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 16px;width:100%;max-width:520px}
.tst{padding:10px 18px;border-radius:999px;font-size:13px;animation:rise .22s ease;max-width:100%}
.tst.err{color:#8E3A31;background:rgba(255,236,232,.9)}
:root[data-theme="dark"] .tst.err{color:#FFD2C8;background:rgba(92,40,33,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tst.err{color:#FFD2C8;background:rgba(92,40,33,.85)}}

.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:6px 13px;
  font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.pick button:hover{background:var(--glass-3)}
.pick button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--brand-2);font-weight:500}
.hist{display:flex;flex-direction:column;gap:0;font-size:12px}
.hist div{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);color:var(--ink-2)}
.hist time{font-family:var(--f-data);color:var(--ink-3);flex:0 0 108px;font-size:11px}
.rowline{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.rowline>*{flex:1;min-width:110px}
.rowline .btn{flex:0 0 auto}
.muted{color:var(--ink-3);font-size:12.5px}
.warn{padding:11px 14px;border-radius:14px;font-size:12.5px;background:rgba(200,136,120,.16);
  border:1px solid rgba(200,136,120,.32);color:var(--ink)}
.ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;
  flex:0 0 26px;font-family:var(--f-data);letter-spacing:.02em}

/* calendario de selección de días */
.cal{user-select:none;-webkit-user-select:none;touch-action:none;max-width:330px}
.doscol{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.doscol>.izq{flex:0 0 330px;max-width:100%;display:flex;flex-direction:column;gap:11px}
.doscol>.der{flex:1;min-width:250px;display:flex;flex-direction:column;gap:14px}
.cal .cabm{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cal .cabm .m{flex:1;text-align:center;font-size:13.5px;font-weight:500;text-transform:capitalize}
.cal .cabm button{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.cal .cabm button:hover{background:var(--glass-3)}
.cal .cabm button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.cal .sem,.cal .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .sem span{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding-bottom:5px}
.cal .dias button{border:1px solid transparent;background:var(--glass-2);border-radius:11px;
  aspect-ratio:1/1;font:inherit;font-size:12.5px;font-family:var(--f-data);cursor:pointer;color:var(--ink);
  display:grid;place-items:center;position:relative;padding:0;min-height:34px}
.cal .dias button:hover{background:var(--glass-3)}
.cal .dias button.out{opacity:.3}
.cal .dias button.pas{opacity:.34;cursor:default}
.cal .dias button.hoy{border-color:var(--line-2);font-weight:500}
.cal .dias button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:500}
.cal .dias button .mk{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--brand-2)}
.cal .dias button.on .mk{background:var(--brand-ink);opacity:.8}
.cal .dias button .chq{position:absolute;inset:0;border-radius:11px;
  box-shadow:inset 0 0 0 1.5px rgba(200,90,70,.85)}

#mtoggle{display:none}
@media (max-width:900px){
  body{overflow:auto}
  #app{flex-direction:column;height:auto;min-height:100%;padding:12px;gap:12px;overflow:visible}
  #side{flex:none;width:100%;padding:14px}
  #side nav{max-height:0;overflow:hidden;transition:max-height .28s ease}
  #side.open nav{max-height:74vh;overflow-y:auto}
  .brandbox{flex-direction:row;justify-content:flex-start;gap:12px;padding:0}
  .brandbox img{width:104px}
  .brandbox small{display:none}
  #mtoggle{display:grid}
  #side:not(.open) #mebox{display:none}
  #main{overflow:visible}
  #view{overflow:visible}
  #gridwrap{height:auto;max-height:72vh}
  .datenav .d{min-width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

async function boot(){
  try{ S.user=await claude.use("user"); }catch(e){}
  if(S.user){
    try{ S.me=await S.user.me(); S.uid=S.me.id; S.email=(S.me.email||"").toLowerCase(); S.owner=!!S.me.isOwner; }catch(e){}
  }
  try{ S.db=await claude.use("db"); }catch(e){}
  if(!S.db){ S.cargando=false; render(); return; }
  const sub=(path,key,order)=>{
    let q=S.db.collection(path);
    if(order) q=q.orderBy(order);
    S.subs.push(q.limit(1000).onSnapshot(snap=>{
      S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(key==="sedes") sedePorDefecto();
      if(key==="usuarios") S.usuariosCargados=true;
      if(key==="usuarios"||key==="sedes") aplicarRol();
      render();
    },e=>{ if(e.code!=="revoked") console.warn(path,e.code); }));
  };
  sub("sedes","sedes","nombre"); sub("especialistas","especialistas","nombres");
  sub("servicios","servicios","nombre"); sub("estados","estados","orden");
  sub("usuarios","usuarios"); sub("clientes","clientes"); sub("pendientes","pendientes");
  S.subs.push(S.db.doc("config/app").onSnapshot(snap=>{
    if(snap.exists) S.config=Object.assign(S.config,snap.data());
    S.configCargada=true; sedePorDefecto(); S.cargando=false; render(); importarDatos();
  },()=>{S.configCargada=true;sedePorDefecto();S.cargando=false;render();}));
  suscribirDia();
  setTimeout(()=>{S.configCargada=true;sedePorDefecto();S.cargando=false;render();},2500);
}

const IMPORT_ID="cjm-2026-06";
let importando=false, importIntentado=false;
async function importarDatos(manual){
  if(importando||!S.db) return;
  if(!manual){
    if(!S.owner||importIntentado||S.config.importado===IMPORT_ID) return;
    importIntentado=true;
  }
  importando=true;
  let data;
  try{
    const r=await fetch("import/cjm.json",{cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    data=await r.json();
  }catch(err){ importando=false; if(manual) toast("No encontré el archivo de importación.",true); return; }
  const lease=await S.db.doc("config/app").acquire({holder:S.uid||"import",ttlMs:180000}).catch(()=>({acquired:false}));
  if(!lease.acquired){ importando=false; if(manual) toast("Otra persona está importando en este momento.",true); return; }
  const total=(Object.keys(data.especialistas||{}).length)+(Object.keys(data.clientes||{}).length)
    +(Object.keys(data.citas||{}).length);
  toast("Cargando "+nf(data.totalCitas||0)+" citas del sistema actual…");
  let hechos=0, fallos=0;
  const escribir=async(col,id,doc)=>{
    for(let intento=0;intento<3;intento++){
      try{ await S.db.doc(col+"/"+id).set(doc); return true; }
      catch(e){ if(e&&(e.code==="invalid_argument")) return false;
        await new Promise(r=>setTimeout(r,300*(intento+1))); }
    }
    return false;
  };
  for(const grupo of ["especialistas","clientes","citas"]){
    for(const id in (data[grupo]||{})){
      const ok=await escribir(grupo,id,data[grupo][id]);
      ok?hechos++:fallos++;
      if(hechos%60===0) toast("Cargando… "+hechos+" de "+total);
      await new Promise(r=>setTimeout(r,25));
    }
  }
  if(!fallos) await S.db.doc("config/app").update({importado:IMPORT_ID}).catch(()=>{});
  importando=false;
  const nCli=Object.keys(data.clientes||{}).length, nCit=data.totalCitas||0;
  toast(fallos?("Quedaron "+fallos+" registros sin cargar. Vuelve a intentarlo desde Ajustes."):
    ("Listo: "+nf(nCit)+(nCit===1?" cita":" citas")+" y "+nf(nCli)+(nCli===1?" cliente":" clientes")+" cargados"),
    !!fallos);
}

/* Para fechas que no son la del día abierto (mover una cita a otro día,
   pintar el calendario): se piden una vez y quedan en caché. */
const hfPidiendo={};
function asegurarHorarios(desde,hasta){
  const ex=window.__extra;
  if(!ex||!ex.horarios) return Promise.resolve();
  hasta=hasta||desde;
  const clave=desde+"→"+hasta;
  if(hfPidiendo[clave]) return hfPidiendo[clave];
  hfPidiendo[clave]=ex.horarios({desde:desde,hasta:hasta,especialista:null,sede:null}).then(lista=>{
    for(let f=desde; f<=hasta; f=addDays(f,1)) S.hf[f]=[];
    lista.forEach(x=>{ (S.hf[x.fecha]=S.hf[x.fecha]||[]).push(x); });
    delete hfPidiendo[clave]; render();
  }).catch(e=>{ delete hfPidiendo[clave]; console.warn("horarios",e.message); });
  return hfPidiendo[clave];
}
/* Después de tocar un horario puntual, lo leído deja de valer. El día que
   está abierto se recarga solo; las demás fechas se vuelven a pedir cuando
   hagan falta. */
function olvidarHorarios(){
  for(const k in S.hf) if(k!==S.fecha) delete S.hf[k];
  for(const k in hfPidiendo) delete hfPidiendo[k];
}
let yaAnunciado=false;
function aplicarRol(){
  /* La API manda `id`; la pagina busca `userId`. Hay que aceptar los dos o
     nunca encuentra a la persona y deja el canal por defecto. */
  const u=S.usuarios.find(x=>(x.userId||x.id)===S.uid&&x.activo!==false);
  if(S.owner){ S.rol="admin"; S.canal=u?(u.canal||"Recepcionista"):"Recepcionista"; }
  else if(u){ S.rol=u.rol||"operador"; S.canal=u.canal||"Recepcionista"; }
  else { S.rol="operador"; S.canal="Recepcionista"; }
  /* solo anunciamos al usuario cuando ya sabemos quién está registrado */
  if(!S.usuariosCargados||!S.uid||yaAnunciado||S.owner) return;
  yaAnunciado=true;
  if(u) S.db.doc("pendientes/"+S.uid).delete().catch(()=>{});
  else S.db.doc("pendientes/"+S.uid).set({userId:S.uid,visto:new Date().toISOString()}).catch(()=>{});
}
async function guardarCita(cita,fechaAnterior){
  const f=cita.fecha;
  if(fechaAnterior&&fechaAnterior!==f) await borrarDeDia(fechaAnterior,cita.id);
  const ref=S.db.doc("citas/"+f);
  const patch={fecha:f,items:{}}; patch.items[cita.id]=cita;
  const existe=(f===S.fecha)?S.dia.exists:(await ref.get()).exists;
  if(existe) await ref.update({items:patch.items}); else await ref.set(patch);
  if(cita.tipo!=="bloqueo") await sincronizarCliente(cita);
}
async function borrarDeDia(fecha,id){
  const ref=S.db.doc("citas/"+fecha); const snap=await ref.get();
  if(!snap.exists) return;
  const items=Object.assign({},snap.data().items||{}); delete items[id];
  await ref.set({fecha:fecha,items:items});
}
async function sincronizarCliente(cita){

    especialistaId:cita.especialistaId,servicioId:cita.servicioId,estadoId:cita.estadoId});
  lista.sort((a,b)=>(b.fecha+b.inicio).localeCompare(a.fecha+a.inicio));

}

     quedaba con lo que hubiera en cache desde que se abrió la pestaña, que

/* ═══════════════════ recargar lo que se está mirando ═══════════════════
   El día ya se refrescaba solo cada 12 s; el mes y los reportes no, así que
   recepción podía estar mirando números viejos sin saberlo. Ahora van en el
   mismo reloj, pero SOLO la vista que está en pantalla: no tiene sentido
   pedirle al servidor el mes mientras alguien mira la agenda del día.

   Las pantallas de configuración (especialistas, sedes, servicios, estados,
   usuarios, ajustes) quedan fuera del reloj a propósito: si alguien está
   escribiendo un horario y se le recarga por debajo, pierde lo que llevaba.
   Esas se recargan solo cuando la persona toca «Recargar». */
var cargandoVista = false;
function refrescarVista(o){
  o = o || {};
  if (cargandoVista) return Promise.resolve();   /* no se apilan peticiones */
  var v = S.view, tarea = null;
  /* refrescarDia y cargarClientes viven dentro de la capa de datos, que es una
     IIFE: desde aquí solo se llega por window.__api. */
  if (v === "agenda")            tarea = window.__api.refrescar();
  else if (v === "indicadores")  tarea = cargarMes({silencioso:true});
  else if (v === "clientes")     tarea = window.__api.clientes(S.q || undefined);
  else if (o.aMano)              tarea = cargarMaestros();
  if (!tarea) return Promise.resolve();
  cargandoVista = true;
  if (o.aMano) render();

/* Se apilan: {sobre:true} abre encima sin cerrar la de abajo, y al cerrar
   vuelves a la que estabas (el editor de especialista sigue con sus cambios). */
let sheetAbierto=null, pilaSheets=[];
function abrirSheet(opts){
  if(!opts.sobre) cerrarSheets();
  const foot=h("footer",null,(opts.acciones||[]).filter(Boolean));
  const s=h("div",{class:"sheet g"+(opts.wide?" wide":"")},
    h("header",null,
      h("div",{style:{flex:"1",minWidth:0}},h("h3",null,opts.titulo),opts.sub?h("div",{class:"sub"},opts.sub):null),
      h("button",{class:"x","aria-label":"Cerrar",onclick:cerrarSheet},"✕")),
    h("div",{class:"body"},opts.cuerpo),
    (opts.acciones&&opts.acciones.length)?foot:null);
  const scrim=h("div",{id:"scrim",onclick:e=>{if(e.target===scrim)cerrarSheet();}},s);
  if(opts.sobre) scrim.style.zIndex=String(40+pilaSheets.length);
  document.body.appendChild(scrim); pilaSheets.push(scrim); sheetAbierto=scrim;
  const f=s.querySelector("input,select,textarea"); if(f) setTimeout(()=>f.focus(),60);
}
function cerrarSheet(){
  const s=pilaSheets.pop(); if(s) s.remove();
  sheetAbierto=pilaSheets[pilaSheets.length-1]||null;
}
function cerrarSheets(){ while(pilaSheets.length) pilaSheets.pop().remove(); sheetAbierto=null; }
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ cerrarSheet(); return; }
  if(sheetAbierto) return;
  const t=e.target, editando=t&&(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA");
  if(editando||e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.view!=="agenda") return;
  if(e.key==="ArrowLeft"){ S.fecha=addDays(S.fecha,-1); suscribirDia(); render(); }
  else if(e.key==="ArrowRight"){ S.fecha=addDays(S.fecha,1); suscribirDia(); render(); }
  else if(e.key==="t"||e.key==="T"){ S.fecha=ymd(new Date()); suscribirDia(); render(); }

/* ====================== calendario de varios días ====================== */
const mesDe=f=>String(f).slice(0,7);
function mesSuma(mes,n){
  const a=+mes.slice(0,4), m=+mes.slice(5,7)-1+n;
  const d=new Date(a,m,1);
  return d.getFullYear()+"-"+pad(d.getMonth()+1);
}
const diasDelMes=mes=>new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
/* Los días del mes que caen en esos días de semana (0=domingo … 6=sábado). */
function fechasDelMes(mes,dias,desde){
  const salida=[];
  for(let d=1;d<=diasDelMes(mes);d++){
    const f=mes+"-"+pad(d);
    if(desde&&f<desde) continue;
    if(!dias||dias.includes(parseYmd(f).getDay())) salida.push(f);
  }
  return salida;
}
/* Convierte una selección de fechas sueltas en la menor cantidad de llamadas.
   Si la selección es exactamente «estos días de semana dentro del rango»,
   sale una sola con dias:[…] — que es el atajo que pediste. Si no, una por
   cada tramo seguido. Nunca inventa fechas que no estaban marcadas. */
function planDeEnvio(fechas){
  if(!fechas.length) return [];
  const a=fechas[0], b=fechas[fechas.length-1];
  const dias=Array.from(new Set(fechas.map(f=>parseYmd(f).getDay()))).sort((x,y)=>x-y);
  const todas=[];
  for(let f=a; f<=b; f=addDays(f,1)) if(dias.includes(parseYmd(f).getDay())) todas.push(f);
  if(todas.length===fechas.length&&todas.every((f,i)=>f===fechas[i]))
    return [{desde:a,hasta:b,dias:dias.length===7?null:dias}];
  const tramos=[]; let ini=fechas[0], prev=fechas[0];
  for(let i=1;i<fechas.length;i++){
    if(fechas[i]===addDays(prev,1)){ prev=fechas[i]; continue; }
    tramos.push({desde:ini,hasta:prev}); ini=prev=fechas[i];
  }
  tramos.push({desde:ini,hasta:prev});
  return tramos;
}
/* Calendario de un mes. Se seleccionan varios días con el mouse: haces clic
   y arrastras. o={mes, sel:Set, min, marca:(fecha)=>null|{clase,texto},
   onCambio, onMes}. */
function calendarioMes(o){
  const cont=h("div",{class:"cal"});
  let mes=o.mes||mesDe(ymd(new Date())), arrastre=null;
  const hoy=ymd(new Date());

  function aplicar(b){
    const f=b.getAttribute("data-f");
    if(!f||b.disabled) return;
    if(arrastre.poner){ if(o.sel.has(f)) return; o.sel.add(f); b.classList.add("on"); }
    else { if(!o.sel.has(f)) return; o.sel.delete(f); b.classList.remove("on"); }
    if(o.onCambio) o.onCambio();
  }
  function fin(){ arrastre=null; }
  window.addEventListener("pointerup",fin);
  window.addEventListener("pointercancel",fin);

  function pintar(){
    cont.textContent="";
    const a=+mes.slice(0,4), m=+mes.slice(5,7);
    const desplaz=(new Date(a,m-1,1).getDay()+6)%7;      /* la semana empieza en lunes */
    cont.appendChild(h("div",{class:"cabm"},
      h("button",{type:"button",title:"Mes anterior","aria-label":"Mes anterior",
        onclick:()=>{ mes=mesSuma(mes,-1); pintar(); if(o.onMes) o.onMes(mes); }},
        svg('<path d="M15 5l-7 7 7 7"/>')),
      h("div",{class:"m"},MESES[m-1]+" "+a),
      h("button",{type:"button",title:"Mes siguiente","aria-label":"Mes siguiente",
        onclick:()=>{ mes=mesSuma(mes,1); pintar(); if(o.onMes) o.onMes(mes); }},
        svg('<path d="M9 5l7 7-7 7"/>'))));
    const sem=h("div",{class:"sem"});
    ["L","M","X","J","V","S","D"].forEach(d=>sem.appendChild(h("span",null,d)));
    cont.appendChild(sem);
    const rej=h("div",{class:"dias"});
    for(let i=0;i<desplaz;i++) rej.appendChild(h("div"));
    for(let d=1;d<=diasDelMes(mes);d++){
      const f=mes+"-"+pad(d);
      const pasado=!!(o.min&&f<o.min);
      const mk=o.marca?o.marca(f):null;
      rej.appendChild(h("button",{type:"button","data-f":f,
        class:[o.sel.has(f)?"on":"",pasado?"pas":"",f===hoy?"hoy":""].filter(Boolean).join(" "),
        title:fechaLarga(f)+(mk&&mk.texto?" · "+mk.texto:""),
        disabled:pasado?true:null,
        onpointerdown:ev=>{ ev.preventDefault(); arrastre={poner:!o.sel.has(f)}; aplicar(ev.currentTarget); },
        onpointerenter:ev=>{ if(arrastre) aplicar(ev.currentTarget); }},
        String(d), mk?h("i",{class:mk.clase||"mk"}):null));
    }
    cont.appendChild(rej);
  }
  pintar();
  cont.repintar=pintar;
  cont.mes=()=>mes;
  cont.irA=f=>{ mes=mesDe(f); pintar(); };
  return cont;
}
/* Fila de atajos por día de semana: «los lunes y miércoles de este mes». */
function atajoDiasSemana(cal,sel,onCambio,min){
  const fila=h("div",{class:"pick"});
  [1,2,3,4,5,6,0].forEach(d=>{
    fila.appendChild(h("button",{type:"button",title:"Todos los "+DIAS[d].toLowerCase()+" de este mes",
      style:{minWidth:"38px",justifyContent:"center"},
      onclick:()=>{
        const fs=fechasDelMes(cal.mes(),[d],min);
        const todas=fs.length&&fs.every(f=>sel.has(f));
        fs.forEach(f=>todas?sel.delete(f):sel.add(f));
        cal.repintar(); onCambio();
      }},DIA_CORTO[d]));
  });
  fila.appendChild(h("button",{type:"button",onclick:()=>{
    fechasDelMes(cal.mes(),null,min).forEach(f=>sel.add(f)); cal.repintar(); onCambio();
  }},"Todo el mes"));
  fila.appendChild(h("button",{type:"button",onclick:()=>{
    sel.clear(); cal.repintar(); onCambio();
  }},"Limpiar"));
  return fila;
}

/* ============================ horarios ============================ */
/* La regla, en un solo sitio: si hay horario puntual para esa FECHA y esa
   SEDE, ese manda y el semanal de esa sede se ignora. Si no, rige el semanal.
   Es por pareja (especialista, sede): un puntual en El Tesoro no le quita a
   Bogotá su horario de siempre. La API aplica exactamente lo mismo, así que
   lo que se pinta y lo que se ofrece no se pueden separar. */
function puntuales(espId,sedeId,fecha){
  const l=S.hf[fecha];
  if(!Array.isArray(l)) return null;                    /* esa fecha no se ha leído */
  return l.filter(f=>f.especialistaId===espId&&(!sedeId||f.sedeId===sedeId));
}
function hayPuntual(espId,sedeId,fecha){
  const p=puntuales(espId,sedeId,fecha);
  return !!(p&&p.length);
}
function franjas(esp,sedeId,fecha){
  const dia=parseYmd(fecha).getDay();
  const sem=(esp.horarios||[]).filter(x=>x.dia===dia&&(!sedeId||x.sedeId===sedeId));
  const pts=puntuales(esp.id,sedeId,fecha);
  if(!pts||!pts.length) return sem;
  const pisadas=new Set(pts.map(f=>f.sedeId));
  return pts.concat(sem.filter(f=>!pisadas.has(f.sedeId)));
}
function trabajaHoy(esp,sedeId,fecha){ return franjas(esp,sedeId,fecha).length>0; }
function dentroDeHorario(esp,sedeId,fecha,ini,fin){
  const fs=franjas(esp,sedeId,fecha); if(!fs.length) return false;
  return fs.some(f=>toMin(ini)>=toMin(f.desde)&&toMin(fin)<=toMin(f.hasta));
}
function enAlmuerzo(esp,sedeId,fecha,ini,fin){
  return franjas(esp,sedeId,fecha).some(f=>f.almDesde&&f.almHasta&&
    toMin(ini)<toMin(f.almHasta)&&toMin(fin)>toMin(f.almDesde));
}
function citasDeEsp(espId,excluirId){
  return Object.values(S.dia.items).filter(c=>c.especialistaId===espId&&c.id!==excluirId
    &&(!S.sede||c.sedeId===S.sede));
}
function choca(espId,ini,fin,excluirId,items){
  return Object.values(items||S.dia.items)
    .filter(c=>c.especialistaId===espId&&c.id!==excluirId)
    .some(c=>toMin(ini)<toMin(c.fin)&&toMin(fin)>toMin(c.inicio));
}
async function chocaEnOtraFecha(cita){
  if(cita.fecha===S.fecha) return false;
  const snap=await S.db.doc("citas/"+cita.fecha).get();
  if(!snap.exists) return false;
  return choca(cita.especialistaId,cita.inicio,cita.fin,cita.id,snap.data().items||{});
}
function validar(cita){
  const esp=byId(S.especialistas,cita.especialistaId);
  if(!esp) return "Falta escoger el especialista.";
  if(toMin(cita.fin)<=toMin(cita.inicio)) return "La hora de fin debe ser después de la de inicio.";
  if(cita.fecha===S.fecha&&choca(cita.especialistaId,cita.inicio,cita.fin,cita.id))
    return "Esa hora choca con otra cita de "+nomEsp(esp)+". Escoge otro horario.";
  if(cita.tipo!=="bloqueo"){
    if(cita.servicioId&&!haceServicio(esp,cita.servicioId))
      return nomEsp(esp)+" no tiene habilitado ese servicio. Actívaselo en Especialistas o escoge otra.";
    if(enAlmuerzo(esp,cita.sedeId,cita.fecha,cita.inicio,cita.fin))
      return nomEsp(esp)+" está en almuerzo a esa hora.";
    if(!S.config.fueraDeHorario&&!dentroDeHorario(esp,cita.sedeId,cita.fecha,cita.inicio,cita.fin)){
      const fs=franjas(esp,cita.sedeId,cita.fecha);
      return fs.length
        ? nomEsp(esp)+" atiende ese día de "+fs.map(f=>f.desde+" a "+f.hasta).join(" y ")+" en esa sede."
        : nomEsp(esp)+" no tiene horario ese día en esa sede. Agrégalo en Especialistas o activa «Permitir agendar fuera de horario» en Ajustes.";
    }
  }
  return null;
}

/* render agrupado: muchas escrituras seguidas repintan una sola vez,
   y lo que estás escribiendo no pierde el foco */
let rafPend=false, rafCola=false;

}

      nf(ocupan)+" ocupan cupo"+(nCitas-ocupan?" ("+nf(nCitas-ocupan)+" canceladas o reprogramadas no cuentan)":"")+

  /* Por qué un hueco no está: horarios especiales de hoy y bloqueos puestos. */
  const especiales=(S.hf[S.fecha]||[]).filter(f=>!S.sede||f.sedeId===S.sede);
  const bloqs=items.filter(c=>c.tipo==="bloqueo"&&ocupaCupo(c));
  if(especiales.length){
    const quienes=Array.from(new Set(especiales.map(f=>{

      title:especiales.map(f=>{ const e=byId(S.especialistas,f.especialistaId);
        return (e?nomEsp(e):"—")+": "+f.desde+" a "+f.hasta+
          (f.almDesde?" (almuerzo "+f.almDesde+"–"+f.almHasta+")":"")+
          (f.nota?" · "+f.nota:""); }).join("\n")+
        "\n\nEste día mandan estos horarios, no el de todas las semanas."},
      especiales.length===1?"Horario especial · "+quienes[0]

  }
  if(bloqs.length) resumen.appendChild(h("span",{class:"chip",style:{background:"var(--glass-2)"},
    title:bloqs.map(c=>{ const e=byId(S.especialistas,c.especialistaId);
      return (e?nomEsp(e):"—")+": "+c.inicio+"–"+c.fin+" · "+(c.motivo||c.notas||"Bloqueo"); }).join("\n")},
    nf(bloqs.length)+(bloqs.length===1?" bloqueo":" bloqueos")));
  view.appendChild(resumen);

  if(!S.especialistas.length||!S.sedes.length){
    view.appendChild(h("div",{class:"g empty"},h("h3",null,"Todavía no hay sedes ni especialistas"),

      esAdmin()?h("button",{class:"btn pri",onclick:()=>irA("sedes")},"Crear sedes"):null));
    return;

  if(!cols.length){
    view.appendChild(h("div",{class:"g empty"},h("h3",null,"Nadie atiende este día con ese filtro"),
      h("p",null,"Cambia de sede o de fecha, o revisa los horarios del especialista.")));
