/* ── cupos que alguien está apartando ahora mismo desde la tablet ──────── */
function apartadosDeEsp(espId){
  var hoy = ymd(new Date());
  if (S.fecha !== hoy) return [];        /* solo tiene sentido en el día de hoy */
  return (window.__api.apartados() || []).filter(function(r){
    return r.especialistaId === espId
      && String(r.fecha).slice(0,10) === S.fecha
      && (!S.sede || r.sedeId === S.sede)
      /* el servidor ya solo manda las vivas; si además dice cuánto les queda,
         se descartan las que se vencieron entre que respondió y se pintó */
      && (minutosQueQuedan(r) === null || minutosQueQuedan(r) > 0);
  });
}
/* Cuánto le queda al cupo. La cuenta la hace el SERVIDOR y viene en
   quedan_minutos: expira_en es un timestamp sin zona, y si lo resta el
   navegador lo lee como hora local — con el servidor en UTC y la tablet en
   Colombia eso da cinco horas de más. Es la misma trampa que ya nos costó
   los huecos escondidos de la mañana.
   Si el servidor no manda la cuenta, no se inventa un número: se dibuja el
   cupo sin reloj, que es mejor que decir una mentira. */
function minutosQueQuedan(r){
  var m = r.quedanMinutos;
  if (m === undefined || m === null || m === "") return null;
  m = Number(m);
  return isFinite(m) ? Math.ceil(m) : null;
}
function bloqueApartado(r, ini, ppm){
  var a = toMin(String(r.inicio).slice(0,5)), b = toMin(String(r.fin).slice(0,5));
  var quedan = minutosQueQuedan(r);
  return h("div",{class:"cita apartado",
    title:"Alguien está escogiendo esta hora en la tablet. Queda bloqueada "
          + "hasta que termine o se le venza el tiempo.",
    style:{top:((a-ini)*ppm)+"px", height:Math.max(22,(b-a)*ppm-3)+"px"}},
    h("div",{class:"who"},"Apartado"),
    h("div",{class:"cuando"}, quedan === null ? "alguien lo está escogiendo"
                            : quedan === 1    ? "vence en 1 minuto"
                                              : "vence en " + quedan + " minutos"));
}

function gridAgenda(cols){
  const sedeSel=byId(S.sedes,S.sede);
  let ini=toMin((sedeSel&&sedeSel.horaInicio)||S.config.horaInicio);
  let fin=toMin((sedeSel&&sedeSel.horaFin)||S.config.horaFin);
  Object.values(S.dia.items).forEach(c=>{
    if(S.sede&&c.sedeId!==S.sede) return;
    ini=Math.min(ini,toMin(c.inicio)); fin=Math.max(fin,toMin(c.fin));
  });
  const total=Math.max(60,fin-ini);
  const ppm=S.config.zoom||1.5, alto=total*ppm, slot=S.config.slot||30;
  const wrap=h("div",{class:"g agwrap"}), sc=h("div",{id:"gridwrap"});
  const grid=h("div",{id:"grid",style:{gridTemplateColumns:"62px repeat("+cols.length+",minmax(178px,1fr))"}});
  grid.appendChild(h("div",{class:"gh gcorner",style:{gridRow:1,gridColumn:1}},
    h("div",{class:"n",style:{fontSize:"10px",letterSpacing:".12em",textTransform:"uppercase",color:"var(--ink-3)"}},"Hora")));
  cols.forEach((e,i)=>{
    const n=citasDeEsp(e.id).filter(c=>c.tipo!=="bloqueo").length;
    const sedeN=(e.sedes||[]).map(id=>byId(S.sedes,id)).filter(Boolean).map(s=>s.nombre);
    const pts=puntuales(e.id,S.sede||null,S.fecha)||[];
    grid.appendChild(h("div",{class:"gh",style:{gridRow:1,gridColumn:i+2},
      title:nomEsp(e)+(pts.length?"\n\nHorario especial de hoy: "+
        pts.map(f=>f.desde+" a "+f.hasta+(f.nota?" ("+f.nota+")":"")).join(" y ")+
        "\nEl horario de todas las semanas no aplica hoy en esta sede.":"")},
      h("div",{style:{display:"flex",gap:"8px",alignItems:"center",minWidth:0}},
        h("span",{class:"ava",style:{width:"23px",height:"23px",flex:"0 0 23px",fontSize:"9px",
          background:hexA(e.color||"#C88878",.3),color:"var(--ink)"}},iniciales(nomEsp(e))),
        h("div",{class:"n",style:{flex:"1",minWidth:0}},nomEspCorto(e)),
        pts.length?h("span",{class:"dot",style:{width:"6px",height:"6px",borderRadius:"50%",
          flex:"0 0 6px",background:"var(--brand-2)"},"data-especial":"1"}):null),
      h("div",{class:"m",style:{marginLeft:"31px"}},
        pts.length?("horario especial "+pts[0].desde+"–"+pts[0].hasta)
                  :(n?(n+(n===1?" cita":" citas")):"libre"),
        (!S.sede&&sedeN.length===1)?" · "+sedeN[0]:"")));
  });
  const gt=h("div",{class:"gtime",style:{gridRow:2,gridColumn:1,height:alto+"px",position:"sticky"}});
  for(let m=ini;m<=fin;m+=60) gt.appendChild(h("div",{style:{top:((m-ini)*ppm)+"px"}},toHM(m)));
  grid.appendChild(gt);

  cols.forEach((e,i)=>{
    const col=h("div",{class:"gcol","data-esp":e.id,style:{gridRow:2,gridColumn:i+2,height:alto+"px"}});
    for(let m=ini;m<=fin;m+=slot)
      col.appendChild(h("div",{class:"hr"+(m%60?" half":""),style:{top:((m-ini)*ppm)+"px"}}));
    const fs=franjas(e,S.sede||null,S.fecha);
    const especial=hayPuntual(e.id,S.sede||null,S.fecha);
    const porQue=especial
      ? "Horario especial de este día: "+fs.map(f=>f.desde+" a "+f.hasta).join(" y ")+
        ". El de todas las semanas no aplica hoy."
      : (fs.length?"Fuera del horario de "+nomEspCorto(e)+" ("+
                   fs.map(f=>f.desde+" a "+f.hasta).join(" y ")+")."
                 : nomEspCorto(e)+" no tiene horario este día en esta sede.");
    const libres=fs.length?fs.map(f=>[toMin(f.desde),toMin(f.hasta)]).sort((a,b)=>a[0]-b[0]):[];
    let cur=ini;
    for(const [a,b] of libres){ if(a>cur) col.appendChild(off(cur,a)); cur=Math.max(cur,b); }
    if(cur<fin) col.appendChild(off(cur,fin));
    fs.forEach(f=>{ if(f.almDesde&&f.almHasta) col.appendChild(bloqueAlmuerzo(f,ini,ppm)); });
    function off(a,b){ return h("div",{class:"off",title:porQue,
      style:{top:((a-ini)*ppm)+"px",height:((b-a)*ppm)+"px"}}); }
    col.addEventListener("click",ev=>{
      if(ev.target.closest(".cita")) return;
      const y=ev.clientY-col.getBoundingClientRect().top;
      let m=ini+Math.round(y/ppm/slot)*slot; m=Math.max(ini,Math.min(fin-slot,m));
      editorCita(null,{especialistaId:e.id,inicio:toHM(m),sedeId:S.sede||(e.sedes||[])[0]||""});
    });
    citasDeEsp(e.id).forEach(c=>col.appendChild(bloqueCita(c,ini,ppm)));
    apartadosDeEsp(e.id).forEach(r=>col.appendChild(bloqueApartado(r,ini,ppm)));
    grid.appendChild(col);
  });
  /* línea de la hora actual, solo si estás viendo hoy */
  if(S.fecha===ymd(new Date())){
    const ahora=new Date().getHours()*60+new Date().getMinutes();
    if(ahora>=ini&&ahora<=fin){
      const y=(ahora-ini)*ppm;
      grid.appendChild(h("div",{style:{gridRow:2,gridColumn:"1 / -1",position:"relative",
        height:"0",pointerEvents:"none",zIndex:"6",marginTop:"13px"}},
        h("div",{style:{position:"absolute",top:y+"px",left:"0",right:"0",height:"0",
          borderTop:"2px solid var(--brand)",opacity:".8"}},
          h("span",{style:{position:"absolute",left:"6px",top:"-9px",fontSize:"9.5px",
            fontFamily:"var(--f-data)",fontWeight:"500",color:"var(--brand-ink)",
            background:"var(--brand)",borderRadius:"999px",padding:"1px 7px"}},toHM(ahora)))));
    }
  }
  sc.appendChild(grid); wrap.appendChild(sc);
  habilitarArrastre(grid,cols,ini,ppm,slot,fin);
  return wrap;
}

function habilitarArrastre(grid,cols,gIni,ppm,slot,gFin){
  let st=null, tragarClick=false;
  /* tras arrastrar, el navegador dispara un click: no debe abrir el editor */
  grid.addEventListener("click",ev=>{
    if(tragarClick){ tragarClick=false; ev.stopPropagation(); ev.preventDefault(); }
  },true);
  grid.addEventListener("pointerdown",ev=>{
    const el=ev.target.closest(".cita"); if(!el||el.classList.contains("bloq")) return;
    const c=S.dia.items[el.dataset.id]; if(!c) return;
    st={el:el,c:c,y0:ev.clientY,x0:ev.clientX,top0:parseFloat(el.style.top),movido:false,
      rects:cols.map(e=>({id:e.id,r:grid.querySelector('.gcol[data-esp="'+e.id+'"]').getBoundingClientRect()}))};
    el.setPointerCapture(ev.pointerId);
  });
  grid.addEventListener("pointermove",ev=>{
    if(!st) return;
    const dy=ev.clientY-st.y0, dx=ev.clientX-st.x0;
    if(!st.movido&&Math.abs(dy)<5&&Math.abs(dx)<5) return;
    st.movido=true; st.el.classList.add("drag");
    const dm=Math.round(dy/ppm/slot)*slot;
    const dur=toMin(st.c.fin)-toMin(st.c.inicio);
    let nuevo=Math.max(gIni,Math.min(gFin-dur,toMin(st.c.inicio)+dm));
    st.nuevoIni=toHM(nuevo);
    st.el.style.top=((nuevo-gIni)*ppm)+"px";
    const hit=st.rects.find(o=>ev.clientX>=o.r.left&&ev.clientX<=o.r.right);
    st.nuevoEsp=hit?hit.id:st.c.especialistaId;
    st.el.style.opacity=(st.nuevoEsp!==st.c.especialistaId)?".72":".92";
  });
  const soltar=async ev=>{
    if(!st) return; const s=st; st=null;
    s.el.classList.remove("drag"); s.el.style.opacity="";
    if(!s.movido) return;
    tragarClick=true; setTimeout(()=>{tragarClick=false;},400);
    const dur=toMin(s.c.fin)-toMin(s.c.inicio);
    const cita=Object.assign({},s.c,{inicio:s.nuevoIni,fin:toHM(toMin(s.nuevoIni)+dur),
      especialistaId:s.nuevoEsp||s.c.especialistaId});
    if(cita.inicio===s.c.inicio&&cita.especialistaId===s.c.especialistaId){ render(); return; }
    const err=validar(cita);
    if(err){ toast(err,true); render(); return; }
    const antesE=byId(S.especialistas,s.c.especialistaId), ahoraE=byId(S.especialistas,cita.especialistaId);
    const cambioEsp=antesE!==ahoraE;
    bitacora(cita,"Movida dentro del día: "+s.c.inicio+(cambioEsp?" con "+nomEsp(antesE):"")+
      " → "+cita.inicio+(cambioEsp?" con "+nomEsp(ahoraE):""));
    try{ await guardarCita(cita);
      toast("Movida a las "+cita.inicio+(cambioEsp?" con "+nomEsp(ahoraE):"")); }
    catch(e){ toast("No se pudo mover la cita.",true); render(); }
  };
  grid.addEventListener("pointerup",soltar);
  grid.addEventListener("pointercancel",()=>{ if(st){st.el.classList.remove("drag");st=null;render();} });
}

/* ---------- EDITOR DE CITA ---------- */
function editorCita(cita,pre,extra){
  extra=extra||{};
  const nueva=extra.nueva!==undefined?extra.nueva:!cita;
  const esB=(cita&&cita.tipo==="bloqueo")||(pre&&pre.tipo==="bloqueo");
  const c=Object.assign({
    id:uid("c_"),tipo:esB?"bloqueo":"cita",fecha:S.fecha,clienteId:"",especialistaId:"",
    sedeId:S.sede||"",servicioId:"",inicio:"09:00",fin:"09:30",
    estadoId:(S.estados.find(e=>e.inicial)||S.estados[0]||{}).id||"",
    notas:"",motivo:"",canal:S.canal,creadoPor:S.uid||"",
    creadoEn:new Date().toISOString(),historial:[]
  },cita||{},pre||{});
  if(nueva&&!c.sedeId&&S.sedes.length===1) c.sedeId=S.sedes[0].id;
  if(nueva&&!c.especialistaId&&pre&&pre.especialistaId) c.especialistaId=pre.especialistaId;
  if(nueva&&pre&&pre.inicio) c.fin=toHM(toMin(pre.inicio)+(S.config.slot||30));

  const body=h("div",{style:{display:"contents"}});
  const aviso=h("div",{style:{display:"none"}});
  let cliSel=extra.cliente||byId(S.clientes,c.clienteId)||null;

  /* cliente */
  const cliBox=h("div");
  function pintarCliente(){
    cliBox.textContent="";
    if(esB) return;
    if(cliSel){
      cliBox.appendChild(h("div",{class:"g g-2",style:{padding:"13px 15px",display:"flex",gap:"11px",alignItems:"center",borderRadius:"18px"}},
        h("span",{class:"ava",style:{background:hexA("#C88878",.3)}},ini(nomCli(cliSel))),
        h("div",{style:{flex:"1",minWidth:0}},
          h("div",{style:{fontWeight:"500"}},nomCli(cliSel)),
          h("div",{class:"muted",style:{display:"flex",gap:"7px",alignItems:"center",flexWrap:"wrap"}},
            (cliSel.tipoDoc||"CC").replace("Cédula de Ciudadanía","CC")+" "+(cliSel.documento||"—"),
            h("span",null,"·"), telefono(cliSel.telefono))),
        h("button",{class:"btn sm",onclick:()=>{cerrarSheet();perfilCliente(cliSel);}},"Ver ficha"),
        h("button",{class:"btn sm",onclick:()=>{cliSel=null;c.clienteId="";pintarCliente();}},"Cambiar")));
      return;
    }
    const inp=h("input",{type:"search",placeholder:"Buscar por documento, nombre o teléfono…",autocomplete:"off"});
    const res=h("div",{class:"pick",style:{marginTop:"8px"}});
    inp.addEventListener("input",()=>{
      const q=norm(inp.value); res.textContent="";
      if(q.length<2) return;
      S.clientes.filter(x=>norm(nomCli(x)).includes(q)||String(x.documento||"").includes(q)||String(x.telefono||"").includes(q))
        .slice(0,8).forEach(x=>res.appendChild(h("button",{onclick:()=>{cliSel=x;c.clienteId=x.id;pintarCliente();}},
          nomCli(x)+" · "+(x.documento||"—"))));
      if(!res.children.length) res.appendChild(h("span",{class:"muted"},"Sin resultados."));
    });
    cliBox.appendChild(campo("Cliente",inp,true));
    cliBox.appendChild(res);
    cliBox.appendChild(h("button",{class:"btn sm",style:{marginTop:"9px"},
      onclick:()=>editorCliente(null,nuevo=>{ c.clienteId=nuevo.id;
        editorCita(cita,Object.assign({},c),{nueva:nueva,cliente:nuevo}); })},
      svg('<path d="M12 5v14M5 12h14"/>'),"Crear cliente nuevo"));

/* ============================================================
   DISPONIBILIDAD
   Calcula los huecos libres. Es la misma regla que tiene que
   aplicar el agente virtual cuando agende por WhatsApp:
   horario de la especialista en esa sede y día, menos almuerzo,
   menos las citas que ya ocupan cupo (canceladas y reprogramadas
   no ocupan), en pasos del tamaño del servicio.
   ============================================================ */
function ocupaCupo(c){
  if(!c) return false;
  /* El bloqueo tapa la franja mientras esté vivo. Si se anula, devuelve el
     horario igual que una cita cancelada — antes se daba por tapado siempre
     y ese rango quedaba muerto para siempre. Es la misma regla que aplica el
     trigger de la base. */
  const t=estadoDe(c.estadoId).tipo;
  return t!=="cancelado"&&t!=="movido";
}
function huecosDelDia(fecha,items,opts){
  const dur=opts.duracion||30, paso=opts.paso||30, out=[];
  const esps=S.especialistas.filter(e=>e.activo!==false
    &&(!opts.especialistaId||e.id===opts.especialistaId)
    &&(!opts.sedeId||(e.sedes||[]).includes(opts.sedeId))
    &&(!opts.servicioId||haceServicio(e,opts.servicioId)));
  const ahora=new Date(), hoy=ymd(ahora), minAhora=ahora.getHours()*60+ahora.getMinutes();
  for(const e of esps){
    const fs=franjas(e,opts.sedeId||null,fecha);
    const suyas=Object.values(items||{}).filter(c=>c.especialistaId===e.id
      &&(!opts.sedeId||c.sedeId===opts.sedeId)&&ocupaCupo(c));
    for(const f of fs){
      const desde=toMin(f.desde), hasta=toMin(f.hasta);
      for(let m=desde;m+dur<=hasta;m+=paso){
        if(fecha===hoy&&m<minAhora+15) continue;                       // ya pasó
        if(f.almDesde&&f.almHasta&&m<toMin(f.almHasta)&&m+dur>toMin(f.almDesde)) continue;
        if(suyas.some(c=>m<toMin(c.fin)&&m+dur>toMin(c.inicio))) continue;
        out.push({fecha:fecha,inicio:toHM(m),fin:toHM(m+dur),
          especialistaId:e.id,sedeId:opts.sedeId||(e.sedes||[])[0]||""});
      }
    }
  }
  return out.sort((a,b)=>a.inicio.localeCompare(b.inicio));
}
async function buscarHuecos(opts){
  const dias=[];
  for(let i=0;i<(opts.dias||14);i++) dias.push(addDays(opts.desde,i));
  const snap=await S.db.collection("citas")
    .where("fecha",">=",dias[0]).where("fecha","<=",dias[dias.length-1]).limit(60).get();
  const porDia={};
  snap.docs.forEach(d=>{porDia[d.id]=(d.data().items)||{};});
  return dias.map(f=>({fecha:f,huecos:huecosDelDia(f,porDia[f]||{},opts)}))
    .filter(d=>d.huecos.length);
}
function panelDisponibilidad(pre){
  const o={sedeId:(pre&&pre.sedeId)||S.sede||((S.sedes[0]||{}).id),
    servicioId:(pre&&pre.servicioId)||"",especialistaId:"",desde:S.fecha,dias:14,duracion:30};
  /* Si viene con un servicio ya escogido, la duracion es la de ESE
     servicio. Con el 30 fijo, la agenda buscaba cupo distinto que la
     tablet de clientas para el mismo servicio. */
  if(o.servicioId){const s0=byId(S.servicios,o.servicioId);
    o.duracion=(s0&&s0.duracion)||30;}
  const res=h("div");
  const inServ=h("select"), inEsp=h("select");
  function refrescar(){
    const act=S.servicios.filter(s=>s.activo!==false)
      .sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),"es"));
    inServ.textContent="";
    inServ.appendChild(h("option",{value:""},"Cualquier servicio · 30 min"));
    act.forEach(s=>{const op=h("option",{value:s.id},s.nombre+" · "+(s.duracion||30)+" min");
      if(s.id===o.servicioId) op.selected=true; inServ.appendChild(op);});
    const esps=S.especialistas.filter(e=>e.activo!==false
      &&(!o.sedeId||(e.sedes||[]).includes(o.sedeId))
      &&(!o.servicioId||haceServicio(e,o.servicioId)))
      .sort((a,b)=>nomEsp(a).localeCompare(nomEsp(b),"es"));
    inEsp.textContent="";
    inEsp.appendChild(h("option",{value:""},"Cualquier especialista"));
    esps.forEach(e=>{const op=h("option",{value:e.id},nomEsp(e));
      if(e.id===o.especialistaId) op.selected=true; inEsp.appendChild(op);});
  }
  refrescar();
  inServ.addEventListener("change",e=>{o.servicioId=e.target.value;
    const s=byId(S.servicios,o.servicioId); o.duracion=(s&&s.duracion)||30;
    refrescar(); correr();});
  inEsp.addEventListener("change",e=>{o.especialistaId=e.target.value;correr();});
  let corriendo=false;
  async function correr(){
    if(corriendo) return; corriendo=true;
    res.textContent=""; res.appendChild(h("p",{class:"muted"},"Buscando huecos…"));
    try{
      const dias=await buscarHuecos(o);
      res.textContent="";
      if(!dias.length){
        res.appendChild(h("div",{class:"empty",style:{padding:"30px 10px"}},
          h("h3",null,"No hay cupos en esos días"),
          h("p",null,"Prueba con otra sede, otro servicio o corre la fecha de inicio.")));
        corriendo=false; return;
      }
      /* agrupado por HORA: así es como pregunta la gente por teléfono */
      dias.slice(0,8).forEach(d=>{
        const porHora=new Map();
        d.huecos.forEach(x=>{ if(!porHora.has(x.inicio)) porHora.set(x.inicio,[]);
          porHora.get(x.inicio).push(x); });
        const horas=Array.from(porHora.keys()).sort();
        const fila=h("div",{class:"pick",style:{marginTop:"8px"}});
        const tope=18;
        horas.slice(0,tope).forEach(hh=>{
          const libres=porHora.get(hh);
          const elegido=libres[0];
          const nombres=libres.map(x=>nomEsp(byId(S.especialistas,x.especialistaId)));
          fila.appendChild(h("button",{
            title:libres.length===1?nombres[0]:("Libre con: "+nombres.join(", ")),
            onclick:()=>{ cerrarSheet();
              S.fecha=elegido.fecha; S.sede=elegido.sedeId; S.sedeElegida=true; S.esp="";
              suscribirDia(); render();
              editorCita(null,{fecha:elegido.fecha,inicio:elegido.inicio,fin:elegido.fin,
                sedeId:elegido.sedeId,especialistaId:elegido.especialistaId,
                servicioId:o.servicioId,clienteId:(pre&&pre.clienteId)||""}); }},
            h("span",{style:{fontFamily:"var(--f-data)",fontWeight:"500"}},hh),
            h("span",{class:"muted",style:{fontSize:"11.5px"}},
              libres.length===1?nomEspCorto(byId(S.especialistas,elegido.especialistaId))
                :(libres.length+" libres"))));
        });
        if(horas.length>tope) fila.appendChild(h("span",{class:"muted",
          style:{alignSelf:"center",padding:"0 6px"}},"y "+(horas.length-tope)+" horas más"));
        const esHoy=d.fecha===ymd(new Date());
        res.appendChild(h("div",{style:{marginTop:"16px"}},
          h("div",{style:{display:"flex",alignItems:"baseline",gap:"9px",flexWrap:"wrap"}},
            h("strong",{style:{fontWeight:"500",fontSize:"13.5px"}},
              (esHoy?"Hoy · ":"")+fechaLarga(d.fecha)),
            h("span",{class:"muted"},horas.length+(horas.length===1?" hora con cupo":" horas con cupo"))),
          fila));
      });
    }catch(e){ res.textContent=""; res.appendChild(h("p",{class:"muted"},"No pude leer la agenda.")); }
    corriendo=false;
  }
  const cuerpo=h("div",{style:{display:"contents"}},
    h("div",{class:"grid2"},
      campo("Sede",sel(S.sedes.filter(s=>s.activo!==false).map(s=>({v:s.id,t:s.nombre})),o.sedeId,
        {onchange:e=>{o.sedeId=e.target.value;o.especialistaId="";refrescar();correr();}})),
      campo("Servicio",inServ)),
    h("div",{class:"grid2"},
      campo("Especialista",inEsp),
      campo("Desde",h("input",{type:"date",value:o.desde,
        onchange:e=>{o.desde=e.target.value||o.desde;correr();}}))),
    h("p",{class:"muted"},"Toca un cupo para agendar ahí mismo. No se muestran horas que ya pasaron, "+
      "ni almuerzos, ni cupos tomados."),
    res);
  setTimeout(correr,0);
  abrirSheet({titulo:"Buscar disponibilidad",sub:"Próximos 14 días",wide:true,cuerpo:cuerpo,
    acciones:[h("button",{class:"btn",onclick:cerrarSheet},"Cerrar")]});
}

function irAFecha(ref){
  cerrarSheet(); S.fecha=ref.fecha; S.esp=""; S.view="agenda";
  suscribirDia(); render(); toast("Agenda del "+fechaLarga(ref.fecha));
}
async function reprogramarDesdePerfil(x){
  try{
    const snap=await S.db.doc("citas/"+x.fecha).get();
    const it=snap.exists&&(snap.data().items||{})[x.id];
    if(!it) return toast("No encontré esa cita. Puede que ya la hayan borrado.",true);
    if(it.reprogramadaA){
      toast("Esa cita ya se reprogramó para el "+fechaLarga(it.reprogramadaA.fecha)+".");
      return irAFecha(it.reprogramadaA);
    }
    reprogramarCita(it);
  }catch(e){ toast("No pude abrir esa cita.",true); }
}
function reprogramarCita(orig){
  const estMov=estadoMovido();
  const cli=byId(S.clientes,orig.clienteId);
  const dur=Math.max(5,toMin(orig.fin)-toMin(orig.inicio));
  const n={fecha:addDays(orig.fecha,7),inicio:orig.inicio,fin:toHM(toMin(orig.inicio)+dur),
    sedeId:orig.sedeId,especialistaId:orig.especialistaId,servicioId:orig.servicioId};
  let motivo="";
  const aviso=h("div",{style:{display:"none"}});
  const inSede=sel(S.sedes.filter(s=>s.activo!==false).map(s=>({v:s.id,t:s.nombre})),n.sedeId,
    {onchange:e=>{n.sedeId=e.target.value;refrescarEsp();chequear();}});
  const inEsp=h("select");
  const inFecha=h("input",{type:"date",value:n.fecha,
    onchange:e=>{n.fecha=e.target.value||n.fecha;
      asegurarHorarios(n.fecha).then(()=>{refrescarEsp();chequear();}); refrescarEsp();chequear();}});
  const inIni=h("input",{type:"time",step:"300",value:n.inicio,onchange:e=>{
    n.inicio=e.target.value||n.inicio; n.fin=toHM(toMin(n.inicio)+dur); inFin.value=n.fin; chequear();}});
  const inFin=h("input",{type:"time",step:"300",value:n.fin,
    onchange:e=>{n.fin=e.target.value||n.fin;chequear();}});
  function refrescarEsp(){
    const lista=S.especialistas.filter(e=>e.activo!==false&&(!n.sedeId||(e.sedes||[]).includes(n.sedeId))
      &&(!n.servicioId||haceServicio(e,n.servicioId)||e.id===n.especialistaId))
      .sort((a,b)=>nomEsp(a).localeCompare(nomEsp(b),"es"));
    inEsp.textContent="";
    inEsp.appendChild(h("option",{value:""},"Seleccione…"));
    lista.forEach(e=>{ const fs=franjas(e,n.sedeId,n.fecha);
      const o=h("option",{value:e.id},nomEsp(e)+(fs.length?" · "+fs.map(f=>f.desde+"–"+f.hasta).join(", "):" · sin horario"));
      if(e.id===n.especialistaId) o.selected=true; inEsp.appendChild(o); });
  }
  refrescarEsp();
  inEsp.addEventListener("change",e=>{n.especialistaId=e.target.value;chequear();});
  const tmp=()=>Object.assign({},orig,{id:"_nueva",fecha:n.fecha,inicio:n.inicio,fin:n.fin,
    sedeId:n.sedeId,especialistaId:n.especialistaId,servicioId:n.servicioId});
  function chequear(){
    const err=(n.especialistaId&&n.sedeId)?validar(tmp()):null;
    if(err){ aviso.style.display=""; aviso.textContent=""; aviso.appendChild(h("div",{class:"warn"},err)); }
    else aviso.style.display="none";
  }
  setTimeout(chequear,0);

    h("div",{class:"g g-2",style:{padding:"13px 15px",borderRadius:"18px"}},

async function cambiarEstadoDesdePerfil(cliente,res,nuevoId){
  try{
    const ref=S.db.doc("citas/"+res.fecha); const snap=await ref.get();
    if(!snap.exists) return toast("No se encontró esa cita.",true);
    const items=Object.assign({},snap.data().items||{});
    const cita=items[res.id]; if(!cita) return toast("No se encontró esa cita.",true);
    const antes=estadoDe(cita.estadoId).nombre;
    cita.estadoId=nuevoId; bitacora(cita,"Estado: "+antes+" → "+estadoDe(nuevoId).nombre+" (desde el perfil del cliente)");
    items[res.id]=cita;
    await ref.set({fecha:res.fecha,items:items});
    const lista=(cliente.citas||[]).map(x=>x.id===res.id?Object.assign({},x,{estadoId:nuevoId}):x);
    await S.db.doc("clientes/"+cliente.id).update({citas:lista});
    cliente.citas=lista;
    toast("Estado actualizado a "+estadoDe(nuevoId).nombre);
  }catch(e){ toast("No se pudo cambiar el estado.",true); }
}

const DIA_CORTO=["D","L","M","X","J","V","S"];
function editorEspecialista(e){

                if(ev.target.checked){
                  x.sedes.push(s.id);
                  if(!franjasDe(s.id).length) [1,2,3,4,5,6].forEach(d=>x.horarios.push(
                    {sedeId:s.id,dia:d,desde:s.horaInicio||"09:00",hasta:s.horaFin||"19:00",
                     almDesde:"13:00",almHasta:"14:00"}));

/* ================= horarios puntuales y bloqueos por rango ================= */
/* Estas dos pantallas hablan con la API por window.__extra. En la copia local
   no existe, así que los botones ni se muestran. */
const hayHorariosPorFecha=()=>!!(window.__extra&&window.__extra.ponerHorarios);
const hayBloqueoRango=()=>!!(window.__extra&&window.__extra.bloquearRango);

function resumenSeleccion(sel){
  const n=sel.size;
  if(!n) return "Ningún día escogido todavía.";
  const fs=Array.from(sel).sort();
  if(n===1) return "1 día escogido — "+fechaLarga(fs[0]);
  /* ¿están todos los días entre el primero y el último? entonces es un rango
     seguido y se lee mejor así que enumerando los días de semana */
  let seguido=true, i=0;
  for(let f=fs[0]; f<=fs[n-1]; f=addDays(f,1),i++) if(fs[i]!==f){ seguido=false; break; }
  if(seguido) return n+" días escogidos — del "+fechaCorta(fs[0])+" al "+fechaCorta(fs[n-1]);
  const plan=planDeEnvio(fs);
  if(plan.length===1&&plan[0].dias)
    return n+" días escogidos — solo los "+
      plan[0].dias.map(d=>DIAS[d].toLowerCase()).join(" y ")+
      ", entre el "+fechaCorta(plan[0].desde)+" y el "+fechaCorta(plan[0].hasta);
  return n+" días escogidos — entre el "+fechaCorta(fs[0])+" y el "+fechaCorta(fs[n-1]);
}

function sheetDiasEspecificos(esp,sedeId){
  const ex=window.__extra;
  const sede=byId(S.sedes,sedeId)||{nombre:"la sede"};
  const sem=(esp.horarios||[]).filter(f=>f.sedeId===sedeId)[0]||{};

        catch(err){ toast(err.message||"No se pudo quitar.",true); ev.currentTarget.disabled=false; }
      }},"Quitar"))));

                  MESES[+mes.slice(5,7)-1]+"? El horario de todas las semanas vuelve a mandar.")) return;
      try{ await ex.quitarHorarios({especialista:esp.id,sede:sedeId,
             desde:mes+"-01",hasta:mes+"-"+pad(diasDelMes(mes))});
        olvidarHorarios(); await cargar(); toast("Mes limpio"); render(); }
      catch(err){ toast(err.message||"No se pudo quitar.",true); }
    }},"Quitar los de este mes"));
  }
  function cargar(){
    const mes=cal.mes();
    return ex.horarios({especialista:esp.id,sede:sedeId,
                        desde:mes+"-01",hasta:mes+"-"+pad(diasDelMes(mes))})
      .then(l=>{ puestos=l; cal.repintar(); pintarLista(); })
      .catch(e=>{ puestos=[]; pintarLista();
        lista.appendChild(h("p",{class:"warn"},"No se pudieron leer los días ya puestos: "+e.message)); });
  }

  const cF=(lbl,el)=>h("label",{class:"fl"},h("span",null,lbl),el);
  const cuerpo=h("div",{style:{display:"contents"}},
    h("div",{class:"doscol"},
      h("div",{class:"izq"},
        cal,
        atajoDiasSemana(cal,marcados,()=>{resumen.textContent=resumenSeleccion(marcados);},hoy),
        resumen),
      h("div",{class:"der"},
        h("p",{class:"muted"},"Haz clic y arrastra para marcar varios días. "+
          "Los que ya tienen horario específico llevan un punto debajo."),
        h("div",{class:"rowline"},
          cF("Desde",h("input",{type:"time",step:"300",value:v.desde,onchange:e=>v.desde=e.target.value})),
          cF("Hasta",h("input",{type:"time",step:"300",value:v.hasta,onchange:e=>v.hasta=e.target.value}))),
        h("div",{class:"rowline"},
          cF("Almuerzo",h("input",{type:"time",step:"300",value:v.almDesde,onchange:e=>v.almDesde=e.target.value})),
          cF("a",h("input",{type:"time",step:"300",value:v.almHasta,onchange:e=>v.almHasta=e.target.value}))),
        campo("Nota (opcional)",h("input",{value:v.nota,placeholder:"Congreso, turno de tarde…",
          oninput:e=>v.nota=e.target.value})),
        h("label",{style:{display:"flex",alignItems:"center",gap:"9px",cursor:"pointer",fontSize:"12.5px"}},
          h("input",{type:"checkbox",checked:true,style:{width:"auto"},
            onchange:e=>v.reemplazar=e.target.checked}),
          "Reemplazar lo que ya hubiera ese día en esta sede"))),
    h("div",null,h("h2",{class:"sec"},"Días específicos de este mes"),lista));

  abrirSheet({sobre:true,wide:true,titulo:"Días específicos",
    sub:nomEsp(esp)+" · "+sede.nombre,cuerpo:cuerpo,
    acciones:[h("button",{class:"btn pri",onclick:async ev=>{
      const fechas=Array.from(marcados).sort();
      if(!fechas.length) return toast("Escoge al menos un día en el calendario.",true);
      if(toMin(v.hasta)<=toMin(v.desde)) return toast("La hora de fin va después de la de inicio.",true);
      if(!!v.almDesde!==!!v.almHasta) return toast("El almuerzo necesita las dos horas.",true);
      if(v.almDesde&&toMin(v.almHasta)<=toMin(v.almDesde))
        return toast("El almuerzo termina antes de empezar.",true);
      const b=ev.currentTarget; b.disabled=true;
      try{
        let puestas=0, saltadas=[];
        for(const t of planDeEnvio(fechas)){
          const r=await ex.ponerHorarios({especialista:esp.id,sede:sedeId,
            desde:t.desde,hasta:t.hasta,inicio:v.desde,fin:v.hasta,
            almDesde:v.almDesde||null,almHasta:v.almHasta||null,
            dias:t.dias||null,nota:v.nota,reemplazar:v.reemplazar});
          puestas+=Number(r&&r.puestas)||0;
          (r&&r.detalle||[]).forEach(d=>{ if(d&&d.puesto===false) saltadas.push(d.fecha); });
        }
        marcados.clear(); olvidarHorarios(); await cargar(); render();
        resumen.textContent=resumenSeleccion(marcados);
        toast(puestas?(puestas+(puestas===1?" día puesto":" días puestos")):"No se puso ninguno",!puestas);
        if(saltadas.length) toast(saltadas.length+(saltadas.length===1?" día ya tenía horario y se dejó como estaba"
          :" días ya tenían horario y se dejaron como estaban")+": "+saltadas.map(fechaCorta).join(", "),true);
      }catch(err){ toast(err.message||"No se pudo guardar.",true); }
      b.disabled=false;
    }},"Guardar estos días"),
    h("button",{class:"btn",onclick:cerrarSheet},"Cerrar")]});
  cargar();
}

function sheetBloqueoRango(pre){
  const ex=window.__extra;
  const hoy=ymd(new Date());
  const marcados=new Set([S.fecha>=hoy?S.fecha:hoy]);
  const v={esp:(pre&&pre.especialistaId)||S.esp||"",
           sede:(pre&&pre.sedeId)||S.sede||"",
           inicio:(pre&&pre.inicio)||S.config.horaInicio||"09:00",
           fin:(pre&&pre.fin)||S.config.horaFin||"19:00",
           motivo:""};
  let bloqueos=[];

  const resumen=h("p",{class:"muted"});
  const aviso=h("div");
  const cal=calendarioMes({mes:mesDe(S.fecha),sel:marcados,min:hoy,
    marca:f=>{ const b=bloqueos.filter(x=>x.fecha===f&&(!v.esp||x.especialistaId===v.esp));
      return b.length?{clase:"mk",texto:b.map(x=>x.inicio+"–"+x.fin+" "+x.motivo).join(" · ")}:null; },
    onCambio:()=>{ resumen.textContent=resumenSeleccion(marcados); },
    onMes:()=>cargar()});
  resumen.textContent=resumenSeleccion(marcados);

  function cargar(){
    const mes=cal.mes();
    return ex.bloqueos({desde:mes+"-01",hasta:mes+"-"+pad(diasDelMes(mes)),
                        especialista:v.esp||null})
      .then(l=>{ bloqueos=l; cal.repintar(); })
      .catch(()=>{ bloqueos=[]; cal.repintar(); });
  }
  const espsPosibles=()=>S.especialistas.filter(e=>e.activo!==false&&
    (!v.sede||(e.sedes||[]).includes(v.sede)));

  const campoEsp=h("div");
  function pintarEsp(){
    campoEsp.textContent="";
    campoEsp.appendChild(campo("Especialista",
      sel([{v:"",t:"Escoge la especialista…"}].concat(espsPosibles()
          .sort((a,b)=>nomEsp(a).localeCompare(nomEsp(b),"es")).map(e=>({v:e.id,t:nomEsp(e)}))),
        v.esp,{onchange:e=>{ v.esp=e.target.value; cargar(); }}),true));
  }
  pintarEsp();

  const cF=(lbl,el)=>h("label",{class:"fl"},h("span",null,lbl),el);
  const cuerpo=h("div",{style:{display:"contents"}},
    h("div",{class:"doscol"},
      h("div",{class:"izq"},
        cal,
        atajoDiasSemana(cal,marcados,()=>{resumen.textContent=resumenSeleccion(marcados);},hoy),
        resumen),
      h("div",{class:"der"},
        h("p",{class:"muted"},"Para vacaciones, un congreso o un día que la sede no abre. "+
          "Haz clic y arrastra para marcar varios días; los que ya tienen un bloqueo llevan un punto."),
        campo("Sede",sel([{v:"",t:"Escoge la sede…"}].concat(
            S.sedes.filter(s=>s.activo!==false).map(s=>({v:s.id,t:s.nombre}))),
          v.sede,{onchange:e=>{ v.sede=e.target.value;
            if(v.esp&&!espsPosibles().some(x=>x.id===v.esp)) v.esp="";
            pintarEsp(); }}),true),
        campoEsp,
        h("div",{class:"rowline"},
          cF("Desde",h("input",{type:"time",step:"300",value:v.inicio,onchange:e=>v.inicio=e.target.value})),
          cF("Hasta",h("input",{type:"time",step:"300",value:v.fin,onchange:e=>v.fin=e.target.value}))),
        campo("Motivo",h("input",{value:v.motivo,placeholder:"Vacaciones, congreso, mantenimiento…",
          oninput:e=>v.motivo=e.target.value})))),
    aviso);

  abrirSheet({wide:true,titulo:"Bloquear varios días",cuerpo:cuerpo,
    acciones:[h("button",{class:"btn pri",onclick:async ev=>{
      const fechas=Array.from(marcados).sort();
      if(!v.esp) return toast("Falta escoger la especialista.",true);
      if(!v.sede) return toast("Falta escoger la sede.",true);
      if(!fechas.length) return toast("Escoge al menos un día en el calendario.",true);
      if(toMin(v.fin)<=toMin(v.inicio)) return toast("La hora de fin va después de la de inicio.",true);
      const b=ev.currentTarget; b.disabled=true;
      try{
        let hechos=0, chocaron=[];
        for(const t of planDeEnvio(fechas)){
          const r=await ex.bloquearRango({especialista:v.esp,sede:v.sede,
            desde:t.desde,hasta:t.hasta,inicio:v.inicio,fin:v.fin,
            dias:t.dias||null,motivo:v.motivo||"Bloqueo"});
          hechos+=Number(r&&r.bloqueados)||0;
          (r&&r.chocaron||[]).forEach(c=>chocaron.push(typeof c==="string"?c:(c&&c.fecha)||String(c)));
        }
        marcados.clear(); await cargar(); render();
        resumen.textContent=resumenSeleccion(marcados);
        aviso.textContent="";
        if(chocaron.length) aviso.appendChild(h("div",{class:"warn"},
          h("strong",null,chocaron.length+(chocaron.length===1?" día no se pudo bloquear":" días no se pudieron bloquear")),
          h("div",{style:{marginTop:"6px"}},"Ya había una cita a esa hora el "+
            chocaron.sort().map(fechaCorta).join(", ")+". "+
            "Hay que mover o cancelar esas citas primero; los demás días sí quedaron bloqueados.")));
        toast(hechos?(hechos+(hechos===1?" día bloqueado":" días bloqueados")):"No se bloqueó ninguno",!hechos);
      }catch(err){ toast(err.message||"No se pudo bloquear.",true); }
      b.disabled=false;
    }},"Bloquear"),
    h("button",{class:"btn",onclick:cerrarSheet},"Cerrar"),
    h("div",{class:"spacer"}),
    h("button",{class:"btn",onclick:()=>{cerrarSheet();editorCita(null,{tipo:"bloqueo"});}},
      "Un solo día, con más detalle")]});
  cargar();
}

      if(!confirm("¿Eliminar «"+(x.nombre||"")+"»?"))return;
      try{ await S.db.doc(col+"/"+x.id).delete(); cerrarSheet(); toast("Eliminado"); }
      catch(e){ toast("No se pudo eliminar.",true); }}},"Eliminar"):null]});
}

/* ---------- INDICADORES ---------- */
function vIndicadores(top,view){
  const hoy=ymd(new Date());
  const mes=S.mes;
  const act=S.sedes.filter(s=>s.activo!==false);
  titulo(top,"Indicadores",
    (S.sedeInd?((byId(S.sedes,S.sedeInd)||{}).nombre+" · "):"Todas las sedes · ")+
      MESES[+mes.slice(5,7)-1]+" "+mes.slice(0,4),
    sel([{v:"",t:"Todas las sedes"}].concat(act.map(s=>({v:s.id,t:s.nombre}))),S.sedeInd,
      {style:{maxWidth:"215px"},onchange:e=>{S.sedeInd=e.target.value;render();}}),
    h("input",{type:"month",value:mes,style:{maxWidth:"165px"},
      onchange:e=>{if(e.target.value){S.mes=e.target.value;cargarMes();}}}),
    h("button",{class:"btn",onclick:()=>{delete S.rango[S.mes];cargarMes();}},
      svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>'),"Actualizar"),
    btnExportar(()=>(S.rango[S.mes]||[]).filter(c=>c.tipo!=="bloqueo"&&(!S.sedeInd||c.sedeId===S.sedeInd)),
      ()=>"citas-"+S.mes+(S.sedeInd?"-"+((byId(S.sedes,S.sedeInd)||{}).nombre||"").replace(/\s+/g,"-").toLowerCase():"")));

  if(!S.rango[mes]){ cargarMes();
    view.appendChild(h("div",{class:"g empty"},h("h3",null,"Calculando…"),h("p",null,"Estoy leyendo las citas del mes.")));
    return;
  }
  const citas=S.rango[mes].filter(c=>c.tipo!=="bloqueo"&&(!S.sedeInd||c.sedeId===S.sedeInd));
  const capMes=(S.sedeInd?act.filter(s=>s.id===S.sedeInd):act)
    .reduce((a,s)=>a+(s.puestos||0)*(s.capacidadDia||16)*(s.diasMes||24),0);
  const tipoDe=id=>estadoDe(id).tipo||"abierto";
  const at=citas.filter(c=>tipoDe(c.estadoId)==="atendido").length;
  const ca=citas.filter(c=>tipoDe(c.estadoId)==="cancelado").length;
  const au=citas.filter(c=>tipoDe(c.estadoId)==="ausente").length;
  const mo=citas.filter(c=>tipoDe(c.estadoId)==="movido").length;
  const hoyCitas=citas.filter(c=>c.fecha===hoy);
  const ocup=pct(citas.length,capMes);

  const kpi=(l,v,s,barra)=>h("div",{class:"g kpi"},h("div",{class:"l"},l),h("div",{class:"v"},v),
    s?h("div",{class:"s"},s):null, barra!==undefined?h("div",{class:"meter"},h("i",{style:{width:Math.min(100,barra)+"%"}})):null);
  view.appendChild(h("div",{class:"kpis"},
    kpi("% Agendamiento",pctTxt(citas.length,capMes),nf(citas.length)+" de "+nf(capMes)+" cupos del mes",ocup),
    kpi("Citas del mes",nf(citas.length),nf(hoyCitas.length)+" hoy"),
    kpi("Atendidas",nf(at),pct(at,citas.length)+"% del total"),
    kpi("Perdidas",nf(ca+au),nf(ca)+" canceladas · "+nf(au)+" no asistieron"),
    kpi("Reprogramadas",nf(mo),pct(mo,citas.length)+"% del total")));

  const panel=(t,sub,contenido)=>h("div",{class:"g pad"},h("h2",{class:"sec"},t,sub?h("small",null,sub):null),contenido);
  const barras=(filas,total,color)=>{
    const max=Math.max(1,...filas.map(f=>f.v));
    return h("div",{class:"bars"+(filas.length>8?" larga":"")},filas.map(f=>h("div",{class:"barrow"},
      h("div",{class:"t"},h("span",null,f.t),h("div",{class:"tr"},h("i",{style:{width:(f.v/max*100)+"%",background:f.c||color||"var(--brand)"}}))),
      h("div",{class:"n"},nf(f.v)+(total?" · "+pct(f.v,total)+"%":"")))));
  };
  const cuenta=(arr,fn)=>{const m={};arr.forEach(x=>{const k=fn(x);if(k)m[k]=(m[k]||0)+1;});return m;};

  const porEst=cuenta(citas,c=>c.estadoId);
  const filasEst=S.estados.filter(e=>porEst[e.id]).sort((a,b)=>porEst[b.id]-porEst[a.id])
    .map(e=>({t:e.nombre,v:porEst[e.id],c:e.color}));

  const porSede=(S.sedeInd?act.filter(s=>s.id===S.sedeInd):act).map(s=>{
    const n=citas.filter(c=>c.sedeId===s.id).length;
    const cap=(s.puestos||0)*(s.capacidadDia||16)*(s.diasMes||24);
    return {nombre:s.nombre,n:n,cap:cap,p:pct(n,cap)};
  }).sort((a,b)=>b.p-a.p);

  const porEsp=cuenta(citas,c=>c.especialistaId);
  const filasEsp=Object.keys(porEsp).map(id=>({t:nomEsp(byId(S.especialistas,id)),v:porEsp[id]}))
    .sort((a,b)=>b.v-a.v).slice(0,12);

  const porCanal=cuenta(citas,c=>c.canal||"Recepcionista");
  const porUsuario={};
  citas.forEach(c=>{const k=c.asignadaPor||c.creadoPor||"—";
    porUsuario[k]=porUsuario[k]||{total:0,at:0,ca:0,au:0,mo:0,canal:{}};
    const u=porUsuario[k]; u.total++;
    if(c.canal) u.canal[c.canal]=(u.canal[c.canal]||0)+1;
    const t=tipoDe(c.estadoId); if(t==="atendido")u.at++; else if(t==="cancelado")u.ca++;
    else if(t==="ausente")u.au++; else if(t==="movido")u.mo++;});

  view.appendChild(h("div",{class:"cards mosaico",style:{marginTop:"13px"}},
    panel("Citas por estado","Con el color que tú les diste",
      filasEst.length?barras(filasEst,citas.length):h("p",{class:"muted"},"Sin citas este mes.")),
    panel("Canal que asigna","Quién agendó cada cita",
      Object.keys(porCanal).length?barras(Object.keys(porCanal).map(k=>({t:k,v:porCanal[k]})),citas.length)
        :h("p",{class:"muted"},"Sin datos.")),
    panel("Ocupación por sede","Citas agendadas contra la capacidad del mes",
      porSede.length?h("div",{class:"bars"+(porSede.length>8?" larga":"")},porSede.map(s=>h("div",{class:"barrow"},
        h("div",{class:"t"},h("span",null,s.nombre),
          h("div",{class:"tr"},h("i",{style:{width:Math.min(100,s.p)+"%",
            background:s.p>=85?"#3E7F5C":s.p>=55?"var(--brand)":"#B8863B"}}))),
        h("div",{class:"n"},pctTxt(s.n,s.cap))))):h("p",{class:"muted"},"Crea las sedes para ver su ocupación.")),
    panel("Especialistas con más citas","Top 12 del mes",
      filasEsp.length?barras(filasEsp,citas.length):h("p",{class:"muted"},"Sin datos.")) ));

  resolverPerfiles(Object.keys(porUsuario).filter(k=>/^u[-_]/.test(k)));
  const filasU=Object.keys(porUsuario).sort((a,b)=>porUsuario[b].total-porUsuario[a].total).slice(0,25)
    .map(k=>{const u=porUsuario[k];
      const reg=S.usuarios.find(x=>(x.userId||x.id)===k);
      const canalTop=Object.keys(u.canal).sort((a,b)=>u.canal[b]-u.canal[a])[0];
      return {celdas:[h("span",{style:{fontWeight:"500"}},
          /^u[-_]/.test(k)?nombrePersona(k,reg&&(reg.alias||reg.nombre)):(k==="—"?"Sin registrar":k)),
        (reg&&reg.canal)||canalTop||"—",
        h("span",{class:"tbl num"},nf(u.total)),h("span",{class:"tbl num"},nf(u.at)),
        h("span",{class:"tbl num"},nf(u.ca)),h("span",{class:"tbl num"},nf(u.au)),
        h("span",{class:"tbl num"},nf(u.mo)),
        h("span",{class:"tbl num"},pct(u.at,u.total)+"%")]};});
  view.appendChild(h("div",{style:{marginTop:"13px"}},
    h("h2",{class:"sec"},"Quién agenda",
      h("small",null,"Productividad por persona en el mes")),
    filasU.length?tabla(["Persona","Canal","Agendadas","Atendidas","Canceladas","No asistió","Reprogramadas","Efectividad"],filasU,true)
      :h("div",{class:"g empty"},h("p",null,"Todavía no hay citas registradas este mes."))));
}
async function cargarMes(o){
  o=o||{};
  const mes=S.mes;
  try{
    /* Ojo: no todos los meses tienen 31 dias. Pidiendo "-31" en
       septiembre la API devolvia error y el reporte caia al cache del
       dia, que no sabe quien agendo la cita. */
    const ult=String(new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate()).padStart(2,"0");
    const snap=await S.db.collection("citas").where("fecha",">=",mes+"-01").where("fecha","<=",mes+"-"+ult).limit(400).get();
    const out=[];
    snap.docs.forEach(d=>{ const it=d.data().items||{}; Object.values(it).forEach(c=>out.push(c)); });
    S.rango[mes]=out; render();
  }catch(e){
    /* Callada (el reloj): se deja lo que había y no se molesta a nadie con un
       aviso. Un parpadeo de red no puede vaciarle el reporte en la cara a
       quien lo está leyendo. */
    if(o.silencioso){ console.warn("mes", e&&e.message); return; }
    S.rango[mes]=[]; toast("No se pudieron leer las citas del mes.",true); render();
  }
}

  titulo(top,"Ajustes","Cómo se comporta la agenda");
  const c=Object.assign({},S.config);
  const body=h("div",{class:"g pad",style:{maxWidth:"620px"}},
    h("h2",{class:"sec"},"Rejilla de la agenda"),
    h("div",{class:"grid3"},
      campo("Abre a las",h("input",{type:"time",step:"1800",value:c.horaInicio,onchange:e=>c.horaInicio=e.target.value})),
      campo("Cierra a las",h("input",{type:"time",step:"1800",value:c.horaFin,onchange:e=>c.horaFin=e.target.value})),
      campo("Bloque",sel([{v:15,t:"15 minutos"},{v:20,t:"20 minutos"},{v:30,t:"30 minutos"},{v:60,t:"1 hora"}],c.slot,
        {onchange:e=>c.slot=+e.target.value}))),
    h("div",{class:"grid2",style:{marginTop:"15px"}},
      campo("Alto de la rejilla",sel([{v:1,t:"Compacta"},{v:1.5,t:"Normal"},{v:2.2,t:"Amplia"}],c.zoom,
        {onchange:e=>c.zoom=+e.target.value})),
      campo("Sede que se abre por defecto",sel([{v:"",t:"La primera de la lista"}].concat(
          S.sedes.filter(s=>s.activo!==false).map(s=>({v:s.id,t:s.nombre}))),c.sedeDefault||"",
        {onchange:e=>c.sedeDefault=e.target.value}))),

    h("label",{style:{display:"flex",gap:"10px",alignItems:"flex-start",cursor:"pointer"}},
      h("input",{type:"checkbox",checked:c.fueraDeHorario?true:null,style:{width:"auto",marginTop:"3px"},
        onchange:e=>c.fueraDeHorario=e.target.checked}),
      h("span",null,h("div",null,"Permitir agendar fuera del horario del especialista"),
        h("div",{class:"muted"},"El cruce de dos citas a la misma hora se sigue bloqueando siempre."))),
    h("div",{style:{marginTop:"22px",display:"flex",gap:"9px",flexWrap:"wrap"}},
      h("button",{class:"btn pri",onclick:async()=>{
        try{ await S.db.doc("config/app").set(Object.assign({},S.config,c)); toast("Ajustes guardados"); }
        catch(e){ toast("No se pudo guardar.",true); }}},"Guardar ajustes")));
  view.appendChild(body);
  view.appendChild(h("div",{class:"g pad",style:{maxWidth:"620px",marginTop:"13px"}},
    h("h2",{class:"sec"},"Datos de ejemplo",
      h("small",null,"Las citas y clientes de prueba que vienen cargados")),
    h("p",{class:"muted"},"Borra los clientes y las citas marcados como ejemplo cuando vayas a arrancar en serio. Sedes, especialistas, servicios y estados se quedan."),
    h("button",{class:"btn danger",style:{marginTop:"12px"},onclick:borrarEjemplos},"Borrar datos de ejemplo")));
  const espacio=h("div",{class:"g pad",style:{maxWidth:"620px",marginTop:"13px"}});
  const maestros=S.sedes.length+S.especialistas.length+S.servicios.length+S.estados.length
    +S.usuarios.length+S.pendientes.length+1;
  function pintarEspacio(dias){
    espacio.textContent="";
    const usado=maestros+S.clientes.length+(dias||0);
    espacio.appendChild(h("h2",{class:"sec"},"Espacio de la base",
      h("small",null,"La herramienta guarda hasta 5.000 registros en total.")));
    espacio.appendChild(h("div",{class:"bars"},
      [["Clientes",S.clientes.length],["Maestros y configuración",maestros],
       ["Días con citas",dias===null?"—":dias]].map(r=>h("div",{class:"barrow"},
        h("div",{class:"t"},h("span",null,r[0]),
          h("div",{class:"tr"},h("i",{style:{width:Math.min(100,(typeof r[1]==="number"?r[1]:0)/5000*100)+"%",
            background:"var(--brand)"}}))),
        h("div",{class:"n"},typeof r[1]==="number"?nf(r[1]):r[1])))));
    espacio.appendChild(h("div",{class:"meter",style:{marginTop:"14px"}},
      h("i",{style:{width:Math.min(100,usado/5000*100)+"%",
        background:usado>4000?"#C0544B":"var(--brand)"}})));
    espacio.appendChild(h("p",{class:"muted",style:{marginTop:"8px"}},

      (usado>4000?" — ya vas ajustado; conviene archivar clientes viejos.":"")));

  view.appendChild(espacio);
  view.appendChild(h("div",{class:"g pad",style:{maxWidth:"620px",marginTop:"13px"}},
    h("h2",{class:"sec"},"Datos del sistema actual",
      h("small",null,"Citas de CJ Medical Bogotá y CJ Medical El Tesoro traídas del informe ADC-08.")),
    h("p",{class:"muted"},S.config.importado===IMPORT_ID
      ? "Ya están cargadas. Si vuelves a darle, se sobrescriben con las mismas del archivo."
      : "Todavía no se han cargado. Dale para traerlas."),
    h("button",{class:"btn",style:{marginTop:"12px"},onclick:()=>importarDatos(true)},
      S.config.importado===IMPORT_ID?"Volver a cargar":"Cargar ahora")));
}
async function borrarEjemplos(){
  if(!confirm("¿Borrar los clientes y citas de ejemplo? Los maestros no se tocan.")) return;
  try{
    const cls=S.clientes.filter(c=>c.ejemplo);
    for(const c of cls) await S.db.doc("clientes/"+c.id).delete();
    const snap=await S.db.collection("citas").limit(200).get();
    for(const d of snap.docs){
      const it=d.data().items||{};
      const quedan={}; let cambio=false;
      Object.keys(it).forEach(k=>{ if(it[k].ejemplo) cambio=true; else quedan[k]=it[k]; });
      if(cambio) await S.db.doc("citas/"+d.id).set({fecha:d.id,items:quedan});
    }
    toast("Datos de ejemplo borrados");
  }catch(e){ toast("No se pudieron borrar del todo.",true); }
}
